      <div class="article-summary">
        <p>ASは5月26日、Aston Martin HondaがカナダGPで両車ともHondaパワーユニットの重大な問題を再発させなかったと報じた。アロンソは週末に車との一体感が増し、数十分の二秒程度の余地を感じたと述べた一方、決勝のリタイア原因はエンジンではなくシートの問題だった。信頼性の改善は前進だが、AMR26はなお順位表の後方にとどまり、速さの不足は残っている。</p>
