      <h1>消費税減税協議は合意できず、8月上旬まで結論を継続</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>食料品の消費税について、自民党は2027年4月から2年間1%への引き下げを主張し、野党の恒久減税・給付優先案と折り合わず、結論を8月上旬へ持ち越した。 実施決定ではないため、合意内容と法案提出、開始時期が確定するまでは政策シナリオとして扱う。 社会保障国民会議議長の小野寺税調会長は各党の意見差を認め、可能な限り一致を目指すと述べた。</p>
