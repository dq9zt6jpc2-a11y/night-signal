      <h1>Starlinkがケニア7郡で新規登録を一時停止し需要超過に対応</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>Starlinkはケニアの7つの郡で新規の住宅向け登録を停止し、現地の需要がネットワーク容量を超えたため待機リストへの登録のみ受け付けている。 対象地域はナイロビ、キアンブ、マチャコス、カジアド、ムランガ、ナクル、ウアシンギシュである。</p>
