      <h1>Hondaと広汽集団、広汽Hondaの合弁期間を延長</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>広汽Hondaは1998年7月設立、1999年3月に広州で生産を開始したHonda初の中国四輪合弁会社で、累計販売は1100万台を超える。 販売・サービス・部品供給・顧客管理情報を統合する「四位一体」の販売サービス網を構築し、中国市場で顧客基盤を広げてきた。 電動化・智能化で競争が激化する中国市場で、両社は技術と資源を組み合わせて商品供給と事業強化を続ける。</p>
