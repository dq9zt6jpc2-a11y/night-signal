      <h1>百事グループ、中国とアジア太平洋で業績大幅成長・物流強化</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年4月、百事グループは上海松江に全チャネル対応のスマート物流センターを建設開始。 総投資額8000万元、面積約2.1万平方メートルで、2026年11月稼働予定。 東華地域の配送効率が向上し、注文の納期遵守率が約10ポイント、全チャネル履行速度が約50%向上する見込み。</p>
