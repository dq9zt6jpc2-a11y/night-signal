      <div class="article-summary">
        <p>OpenAIはAPIとCodexに、Daybreak（旧Trusted Access for Cyber）のアクセス制御を導入する。 対象となる全API組織とChatGPT／CodexワークスペースでDaybreakのアクセス制御が利用可能になった。 Daybreak の利用承認は、承認を受けたお客様に雇用されている人員、またはそのお客様のために業務を行う人員を対象とします。</p>
