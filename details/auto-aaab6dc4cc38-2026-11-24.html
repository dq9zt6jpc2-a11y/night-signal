      <h1>日経平均、前週末比約2,600円高の5万9,000円前後</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>24日前場中ごろの日経平均は、前週末比約2,600円高の5万9,000円前後で推移した。 取引時間中に5万9,000円を上回るのは19日以来、2営業日ぶりだった。 10時時点の東証プライム売買代金は概算2兆4,315億円、売買高は8億567万株だった。</p>
