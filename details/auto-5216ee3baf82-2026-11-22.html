      <h1>SpaceXのTerafab計画、テキサス州の公文書開示訴訟で争点に</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>グライムズ郡委員会は6月3日、SpaceXのTerafab提案を4対1で承認した。 テキサス州司法長官室は7月と8月、特定情報を除きグライムズ郡の記録を開示するよう2件の判断を出した。 SpaceXは記録開示への異議で、施設へのテロ攻撃を可能にする情報や、税制優遇・開発承認を求める手法に関する営業秘密が明らかになると主張した。</p>
