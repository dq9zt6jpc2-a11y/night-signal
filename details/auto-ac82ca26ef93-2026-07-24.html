      <h1>Nasdaq、Nasdaq-100イベント契約を第4四半期に投入へ</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>NasdaqはSECの承認を受け、Nasdaq-100指数を参照するイベント契約を2026年第4四半期に投入する計画を示した。 指数事業は第2四半期に34商品を新規投入し、このうち17商品が海外向け、11商品が機関投資家向け年金分野だった。 直近12カ月の純資金流入の38％は過去5年以内、22％は過去3年以内に投入した商品が生み、12月6日には23時間・週5日取引の開始も予定する。</p>
