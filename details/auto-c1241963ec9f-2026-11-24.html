      <div class="article-summary">
        <p>AI普及を受け、事務職の新卒採用を減らすとした企業が約2割に上ったとマイナビ調査はまとめた。 事務・管理系を採用する企業の19.6%が採用を減らすと答え、増やすとの回答は1.2%だった。 三菱電機はAI活用などを考慮し、2026年度の新卒採用を前年度見込みから約2割減らす計画を2026年3月に発表した。</p>
