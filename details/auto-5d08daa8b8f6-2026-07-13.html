      <h1>BMWがサンパウロ6時間で優勝、マグヌッセンがWEC初勝利を達成した</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月12日に開催されたロレックス6時間サンパウロで、BMW MチームWRTが優勝し、ドライバーのケビン・マグヌッセンがWECでの初勝利を収めた。 このレースでは、ジェネシス・マグマ・レーシングがFP2で初めてセッションを制し、アストンマーチンが好成績を収めた。 FIAは、サンパウロ6時間レース中に道路安全プログラムを通じて企業を認識した。</p>
