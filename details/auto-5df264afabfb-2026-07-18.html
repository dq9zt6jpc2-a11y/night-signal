      <h1>Apple、機密情報窃取を主張してOpenAIを提訴</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>Appleは7月10日、OpenAIと新型AI端末開発に関わるApple元従業員2人をカリフォルニア州北部地区連邦地裁に提訴した。 訴状では製品設計、製造プロセス、サプライチェーン戦略などの機密情報を得る組織的行為があったと主張し、損害賠償と機密情報取得の停止を求めている。</p>
