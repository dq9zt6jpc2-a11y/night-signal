      <h1>米国の中古住宅販売件数が減少、金利高止まりが影響</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>同月の中古住宅販売価格の中央値は、前年同月比で1.8％上昇し、約44万ドルとなりました。 NARは、住宅価格の上昇とローン金利の高止まりが販売件数の減少に影響を与えていると分析しています。</p>
