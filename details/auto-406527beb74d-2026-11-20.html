      <h1>毎月勤労統計を訂正、賃金は最大月20円修正</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>厚生労働省は岩手県内1事業所の入力ミスを受け、2026年1～8月の現金給与総額を最大月20円修正する。 労災年金受給者約20人に追加給付が発生し、平均支給額は1人約40円。 12月上旬に通知し、同月の年金支給日に支払う。 再発防止として誤入力を防ぐ仕組みを作り、自治体職員向けマニュアルも改訂する。</p>
