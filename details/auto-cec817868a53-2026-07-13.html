      <h1>SpaceXのIPO、2兆ドル超の評価額と小口投資家の熱狂的支持で話題に</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>IPOでは約30％の株式が小口投資家向けに割り当てられ、人気の消費者向け証券会社を通じて低い口座最低額で購入可能となった。 小口投資家はエロン・マスク率いる企業に対し、ブランド忠誠心や創業者の使命感に基づく熱狂的な支持を示し、SpaceX IPOは「ゴールドラッシュ」のような熱狂と市場環境への不満が交錯している。</p>
