      <h1>IMF、ベトナムの2026年GDP成長率予測を7.5%に引き上げ、ASEAN最高水準に</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>IMFは2026年のベトナムのGDP成長率予測を7.5%に引き上げ、これは4月時点の7.1%から0.4ポイントの上昇であり、ASEAN諸国の中で最高水準となった。 この成長率は、インドネシアの5.0%、マレーシアの4.7%、フィリピンの3.9%、タイの1.9%を大きく上回り、中国の4.6%やインドの6.4%よりも高い。 ベトナムの成長見通しの改善は、技術輸出の増加と内需の堅調さによるものである。</p>
