      <h2>30秒概要</h2>
      <div class="article-summary">
        <p>Moneycontrolは5月25日、SoftBank Group株が過去最高値へ上昇したと報じた。株価を支えた材料として、同社が投資するOpenAIとSB Energyが将来上場した場合の持分価値への期待を挙げている。AI投資の評価益期待が株価に直接織り込まれた局面であり、事業収益だけでなく未上場投資先の資本市場イベントが日本の親会社評価を動かしている。</p>
