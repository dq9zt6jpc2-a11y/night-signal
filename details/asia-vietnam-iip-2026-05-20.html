      <h1>ベトナム4月IIPは9.9%増。製造業の拡大が続く</h1>

      <h2>30秒概要</h2>
      <div class="summary-lead">ベトナムの4月IIPは前年同月比9.9%増となり、製造業の拡大が続いた。CPIは上昇しているが、生産の伸びが物価圧力を上回り、FDI、輸出、サプライチェーン移転の受け皿としての評価は残る。今後は食品、燃料、為替のコスト上昇が製造業利益と消費にどこまで波及するかを見る局面だ。</div>
