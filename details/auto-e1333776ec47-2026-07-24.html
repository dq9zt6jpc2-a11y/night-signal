      <h1>SpaceX、上場後初の決算と9億株超のロックアップ解除へ</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>SpaceXは8月4日に上場後初となる2026年第2四半期決算を発表する。 2営業日後の8月6日には最大9億1150万株のロックアップが解除され、7月22日終値ベースの時価は約1051億ドルに相当する。 株価は7月22日に6.7％下落して115.26ドルとなり、公募価格135ドルを14.6％下回った。 流通株の約32％に当たる約2億600万株が空売り用に借り入れられている。</p>
