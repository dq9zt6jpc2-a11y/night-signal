      <div class="article-summary">
        <p>アストンマーティンはベルギーGPのFP1でフェルナンド・アロンソに代わりジャック・クロフォードがドライブすることを発表した。 クロフォードは2026年シーズンに3回目のFP1出走となり、2025年F2チャンピオンシップ2位の実績を持つ。 F1のルールにより、ルーキードライバーはシーズン中最低12戦で出走義務がある。</p>
