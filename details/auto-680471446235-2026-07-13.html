      <h1>FRB、インフレ見通し分岐で年内利上げの可能性を議論：FOMC議事録より</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>FRBは、インフレが早期に改善すれば政策金利を維持または引き下げるが、インフレが高止まりし労働市場が安定している場合は、AI需要や中東情勢、関税の影響などを理由に追加利上げが必要と判断する可能性が高い。 FOMCメンバーのドットプロットでは、9人が年内の利上げを支持、8人が据え置き、1人が利下げを支持しており、FRB内でも見通しは拮抗している。</p>
