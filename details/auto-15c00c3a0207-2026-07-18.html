      <h1>ホンダ、北米8拠点目の生産拠点を検討</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>三部敏宏社長は北米について「もう一つ生産拠点がいる」と述べ、新工場を含む生産体制強化に意欲を示した。 北米7拠点の年産能力は計167万台で、2025年度販売は160万台、既存拠点はほぼフル生産だと説明した。 米国ではEVの本格普及は少なくとも5年先との見方を示し、2029年に燃費を1割以上改善した大型HVを投入して北米販売を増やす方針を示した。</p>
