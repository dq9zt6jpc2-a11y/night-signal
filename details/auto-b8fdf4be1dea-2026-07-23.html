      <h1>オイレス工業、過去最高売上でも純利益20.6％減</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>2026年3月期は売上高689億6,400万円で過去最高となった一方、特別損失などで純利益は20.6％減の56億9,000万円だった。 2027年3月期は売上高703億円、純利益56億5,000万円を見込み、年間配当95円と自社株買いを合わせ総還元性向88％を計画する。 営業利益は69億6,000万円、経常利益は72億4,000万円、自己資本比率は80.6％。 半導体製造装置と再生可能エネルギー向け需要が増収に寄与した。</p>
