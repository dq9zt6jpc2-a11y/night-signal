      <h1>OpenAI、ChatGPT Healthを米国の成人ユーザーへ一般提供</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>OpenAIは7月23日、医療記録やApple Healthのデータを連携し、健康状態に応じた回答を生成する「Health in ChatGPT」の米国向け一般提供を開始した。 毎週3億人以上が健康関連の質問をする中、GPT-5.6を採用し、260人超の医師が70万件以上の回答をレビューして精度を高めた。</p>
