      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年6月の米国消費者物価指数（CPI）が前月比0.4％低下し、インフレ圧力の緩和が示された。 この結果、米連邦準備制度理事会（FRB）が7月下旬の会合で利上げを行う可能性が低下し、市場の利上げ観測が後退した。</p>
