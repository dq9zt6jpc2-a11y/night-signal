      <h1>ソフトバンクグループ、株主総会前のQ&amp;A更新でAIデータセンター投資の説明軸を追加</h1>
      <h2>30秒概要</h2>
      <div class="summary-lead">ソフトバンクグループは、5月末に公表したフランスAIデータセンター計画の後、株主総会前のQ&amp;AとIRニュースを並べ、AIインフラ投資と資本政策を同じIR文脈で読める状態にした。フランス案件は最大750億ユーロ、初期フェーズ450億ユーロ、3.1GWの整備計画を含む大型案件で、Armや通信子会社のAI基盤投資と合わせて、資産価値と資金負担の両面を見せる材料になっている。</div>
