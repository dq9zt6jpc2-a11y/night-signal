      <h1>米ドル／円の予想と日本の財政規律への懸念が影響を与える</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>日本の財政規律への懸念が「骨太ショック」と呼ばれ、長期金利上昇が円安の主因とされている。 米ドル／円は158～163円で予想され、投機筋の円売りポジションの動向が注目されている。 政府は「骨太の方針」の閣議決定を目指しており、金利や為替相場に影響を与える可能性がある。</p>
