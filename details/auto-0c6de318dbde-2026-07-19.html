      <h1>NASA、Artemis IIIの通信にStarlinkレーザー端末を採用</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>2027年後半予定のArtemis IIIで、Orion宇宙船外部にStarlinkの小型レーザー端末2台を搭載する。 低軌道での民間月着陸船とのランデブー・ドッキングを4Kで連続中継できる設計で、2万5000超の衛星間レーザーリンク網と通信する。 管制室向け映像の具体的な地上へのダウンリンク構成は、NASAの公開文書ではまだ示されていない。</p>
