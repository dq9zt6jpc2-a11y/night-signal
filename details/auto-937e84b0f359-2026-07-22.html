      <h1>政府が骨太方針を決定、2040年度までに官民投資370兆円</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>高市政権初の骨太方針は「責任ある積極財政」を掲げ、AI・半導体など戦略分野への官民投資を2040年度までに370兆円規模へ拡大する。 成長投資枠を設ける一方、国債発行の抑制と財政規律も明記し、投資の追加性と財源の整合が市場の評価点となる。</p>
