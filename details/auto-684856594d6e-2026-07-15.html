      <h1>東洋電機製造、今期経常利益は減益見通しも増配を発表</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>東洋電機製造は2026年5月期の連結経常利益が前期比36.2％増の35.2億円となったが、2027年5月期は20.5％減の28億円に減益見通し。 前期の年間配当を75円から100円に増額し、今期も16円増配の116円を予定している。 2026年3-5月期の連結経常利益は前年同期比44.5％増の12.7億円に拡大し、売上営業利益率も9.5％から10.6％に改善した。</p>
