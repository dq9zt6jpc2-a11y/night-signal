      <h1>ホルムズ海峡再封鎖懸念と米CPI・台湾半導体大手決算発表が今週の焦点</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>今週は米国CPI（消費者物価指数）と台湾半導体大手の決算発表が予定されている。 日米株式市場は決算発表を控えており、米国株主要3指数は年初来で約10%の上昇を維持している。 原油価格が200日線水準まで反発し、再上昇は株価の重荷となる可能性がある。</p>
