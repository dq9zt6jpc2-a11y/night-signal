      <h1>日経平均が一時4,100円超下落、終値は2,694円安</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>7月17日の日経平均は一時前日比4,100円超下落し、終値は2,694円42銭安の6万4,141円12銭だった。 下落幅は過去5番目の大きさで、キオクシアはストップ安となり、6月22日の最高値の半分以下まで下落した。</p>
