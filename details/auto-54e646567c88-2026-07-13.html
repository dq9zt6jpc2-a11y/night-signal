      <h1>米ドル：エネルギー高と湾岸緊張がドル高を支える、FRB利上げ観測も強さ維持</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>エネルギー価格上昇と湾岸地域の緊張が米ドルを低利回り通貨（ユーロ、円、スイスフラン）に対して支える要因となっている。 米国のエネルギー自立とFRBの利上げ観測がドルの強さを下支え。 DXYは101.50まで上昇する可能性、USD/CHFは0.8140を再テストする見通し。 欧州では天然ガス価格が在庫不足の中で再び上昇しており、エネルギー価格高騰がFRBの金融引き締め懸念を維持し、ドル需要を高めている。</p>
