      <h1>ホンダ、2026年5月に中国製車台を自社車に採用を表明へ</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年4月、ホンダの三部敏宏社長が中国・広州市を訪問し、合弁先の広州汽車集団などを視察した。 5月14日、三部社長は中国メーカーの車台（車の基本構造）をホンダ車に採用すると発表した。 この決定は、前月に電気自動車（EV）戦略の撤回に伴う巨額損失を発表し、退任圧力が高まる中でのものであった。 車台の採用は価格や走行性能に大きく影響し、ホンダが中国の安価で迅速なものづくりを学ぶ姿勢を示したものとみられる。</p>
