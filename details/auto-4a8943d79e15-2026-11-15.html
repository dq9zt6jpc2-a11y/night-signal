      <h1>Mercedes「Update 18」に想定外の欠点、W17の操縦性を悪化</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Mercedes技術責任者James Allison氏は、終盤の空力パッケージ「Update 18」が予期しない性能低下を生み、W17を扱いにくくしたと認めた。 2026年規則で最低車体重量が30kg減の768kgとなる中、Mercedesは開幕時から重量目標を達成したが、他チームの軽量化が進んだことで差が縮まり、Update 18の問題がその傾向を強めた。</p>
