      <h1>東京ボード工業、今期経常損益が5.8億円の赤字見通しを発表</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>東京ボード工業が2026年7月13日に発表した決算によると、2027年2月期第1四半期の連結経常損益は1.4億円の赤字となった。 通期の業績予想は、連結経常損益が5.8億円の赤字になる見通しである。</p>
