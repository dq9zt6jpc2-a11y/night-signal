      <h1>中国・ASEAN法務フォーラム、常設事務局とAI法研究連盟を発足</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>第8回中国・ASEAN法務協力フォーラムが重慶で開幕した。 フォーラムには法務当局者、裁判官、専門家が参加した。 参加者は、企業による現地法への対応と商事紛争の解決を支える司法協力を議論した。 主催者によると、2026年の最初の三四半期の重慶とASEANの貿易額は1164.1億元だった。 同期間の貿易額は前年同期比17％増だった。 開催年は中国・ASEAN対話関係35周年、包括的戦略パートナーシップ樹立5周年に当たる。</p>
