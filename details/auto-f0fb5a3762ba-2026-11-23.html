      <h1>コロンビア、刑務所の通信遮断義務を巡りStarlinkを調査</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>コロンビア情報通信技術省は、刑務所を覆う通信信号の減衰義務に違反した疑いでStarlink S.A.S.への行政調査を開始し、告発した。 同省はLa Picota刑務所で信号を除去または制限する義務に違反した疑いで、複数の通信事業者にも行政調査と告発を行った。 違反が確認された場合、月額法定最低賃金の最大1万5,000倍の罰金、事業の一時停止、免許などの取消しがあり得る。</p>
