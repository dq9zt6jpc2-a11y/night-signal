      <h1>時短勤務の30代女性、夏のボーナス手取り55万円を予想</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>関東地方の30代女性正社員（小売業）が2026年夏のボーナス手取りを55万円と予想し、昨年と同額で横ばいと述べている。 時短勤務のためボーナスが満額もらえなくなったが、業務量を考慮すると減額は妥当ではないと感じている。 ボーナスの主な使途は長男の学費30万円と夏休みの旅行15万円で、残りは貯金や投資に充てる予定。 物価高や住宅ローン金利上昇の影響で家計への負担が増しており、ボーナスは家計に不可欠と考えている。</p>
