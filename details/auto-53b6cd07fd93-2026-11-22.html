      <h1>10月の全国コアCPI、前年同月比2.2％上昇</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>9月に2.4%下落していた電気代が1.6%上昇し、都市ガス代は伸びが0.2%から5.3%に拡大した。 生鮮食品は6.3%上昇と9月の2.1%上昇から大幅に上がった。 総務省が発表した10月の全国消費者物価指数は、価格の変動が大きい生鮮食品を除く総合が102.9と、前の年の同じ月と比べて2.2%上昇しました。</p>
