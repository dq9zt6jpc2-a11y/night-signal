      <h1>FRB、7月FOMCでの利上げ観測が継続：CPI次第で市場の見方に変化も</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>米連邦準備理事会（FRB）は7月28～29日のFOMCで利上げに踏み切るとの観測が金融市場で根強く残っている。 6月の米消費者物価指数（CPI）の結果次第では、原油高によるインフレ圧力への警戒感が和らぎ、7月中の利上げ観測が後退する可能性もある。</p>
