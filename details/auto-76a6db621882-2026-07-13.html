      <h1>エア・カナダがテネリフェ直行便を新規開設、北米とカナリア諸島の初直行路線</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>エア・カナダは2026年秋よりトロントとモントリオールからテネリフェ（カナリア諸島）への直行便を開始し、北米とテネリフェ間で初の直行航空路線を開設する。 この新路線はカナダからの冬季休暇やレジャー旅行の利便性を高め、テネリフェの観光産業や国際的なアクセス向上に寄与する。</p>
