      <h1>米アルファベットがダウ平均に採用、AI時代の主役交代とリスク要因浮上</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>米アルファベット（グーグルの親会社）がダウ平均株価の構成銘柄に採用され、通信大手ベライゾンが除外された。 AI時代の主役交代を象徴する出来事となった。 アルファベットのAI事業は成長しているが、主要研究者の流出やAIインフラへの過剰投資による財務悪化が株価の下落要因となっている。 ダウ平均の構成変更により、ハイテク株のボラティリティがダウ全体に与える影響が今後さらに大きくなる見通し。</p>
