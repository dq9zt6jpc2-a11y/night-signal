      <h1>日本の6月輸出が19.3%増、3年超ぶりの高い伸び</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>半導体関連と円安が輸出額を押し上げ、19.3%増は市場予想18.6%と5月の16.8%を上回り、2022年11月以来の高い伸びになった。 金額増には為替効果が含まれるため、数量、地域別、品目別の内訳と輸入増を合わせて外需の強さを判断する必要がある。 AI需要を背景に東京エレクトロン、ルネサス、アドバンテストの年初来上昇率は50～93%に達している。</p>
