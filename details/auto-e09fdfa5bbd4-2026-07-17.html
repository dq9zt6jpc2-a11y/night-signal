      <h1>4〜6月期の訪日消費額は2兆5,096億円、米国が最大市場に</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年4〜6月期のインバウンド消費額は前年同期比0.2％増の2兆5,096億円で、第2四半期として過去最高となった。 1人当たり旅行支出は24.4万円へ上昇し、国・地域別では米国が3,848億円で首位、中国は前年同期比48.8％減の2,592億円で3位となった。 費目別では宿泊費9,278億円、買物代6,731億円、飲食費5,454億円だった。</p>
