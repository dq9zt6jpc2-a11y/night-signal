      <h1>東京ドームの法人向けVIP個室、開設以来4年間空き待ち</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>2022年開設の「THE SUITE TOKYO」は全28室が法人の年間契約で埋まり、新規申し込みを停止した状態が4年間続いている。 半個室のMASU SUITEは年1056万～2112万円、MASU CABANAは年768万～1536万円で、全室完売または残席僅少となっている。 THE SUITE TOKYOの料金は非公表で、法人限定、専用ゲートとホテルの専属サービスを備える。</p>
