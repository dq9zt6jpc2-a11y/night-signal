      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年のF3カレンダーは、3月6日から8日までオーストラリアのメルボルンで始まる。 2026年のF2カレンダーも同様に、3月6日から8日までオーストラリアのメルボルンで開始される。 2026年のF1カレンダーは、バーレーンとサウジアラビアのレースがキャンセルされたため、22レースに短縮された。</p>
