      <h1>FIA、2027年からF1へ常勤スチュワードを導入</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>FIAは2030年パワーユニット技術枠組みへの全会一致に加え、2027年シーズンに向けて常勤スチュワードの採用を開始した。 常勤化は、現在の持ち回り・非常勤制からF1の競技運営構造を変える。 2030年枠組みは長期の技術規則を定め、常勤スチュワード制度は2027年から週末ごとの裁定の一貫性を高める狙いだ。</p>
