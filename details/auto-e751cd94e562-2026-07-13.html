      <h1>フェルスタッペン陣営がヘルムート・マルコと極秘会談 2027年残留示唆の動きも</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>マックス・フェルスタッペンの父ヨスとマネージャーのレイモンド・フェルミューレンが、元レッドブルのヘルムート・マルコ博士と極秘会談を行ったことが明らかになった。 レッドブル・レーシングはリヤウイング破損問題やFIAとの追加開発機会（ADUO）を巡る協議を継続しており、フェルスタッペン本人もチームファクトリーを訪問するなど2027年も残留する可能性を示唆している。</p>
