      <h1>中国南部で台風によるダム決壊と大規模洪水発生</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中国南部の広西チワン族自治区で台風10号による記録的豪雨が発生し、複数の貯水ダムが決壊して大規模な洪水が発生した。 警察と救助隊がドローンやボートを駆使し、取り残された住民の捜索と救助活動を実施し、20人以上が救助された。</p>
