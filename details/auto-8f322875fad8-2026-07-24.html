      <h1>金利1％上昇、住宅ローンのある30代は年24万円負担増</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>内閣府が24日に公表した今年の経済財政白書は、30代で住宅ローンのある世帯では借入金利が1％幅上がると年間約24万円の負担増になると試算した。 一方、住宅ローンのない70代世帯では、預金などからの受取利息が年約8万円増えるとしており、金利上昇の世代間影響の差を示した。</p>
