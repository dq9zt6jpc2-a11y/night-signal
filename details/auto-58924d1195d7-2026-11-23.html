      <h1>食料品の消費税1%案、2年後の税率復帰リスクを政権有識者が指摘</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>永濱利廣氏と片岡剛士氏は、食料品の消費税率を8%から1%へ下げる案について、価格低下を消費者が実感しやすい物価対策だと説明した。 永濱氏の試算では、2029年度に税率を戻すと実質GDP成長率を約0.3%押し下げる。 両氏は、年5兆円規模の減税に見合う給付付き税額控除がなければ、1%から8%への復帰が景気へ悪影響を与えると指摘した。</p>
