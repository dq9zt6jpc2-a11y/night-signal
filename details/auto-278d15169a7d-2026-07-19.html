      <h1>日経平均、週間で4416円安 SOXは弱気相場入り</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>7月第3週の日経平均は前週末比4416円、率にして6.4％下落し、6万4141円で2週連続安となった。 キオクシアは1カ月で半値となり、半導体関連へ売りが広がってイビデン、東京エレクトロン、住友金属鉱山なども8～10％下落した。 SOX指数は6月22日の最高値から21％下落し、直近高値から20％超下げる弱気相場入りとなった。</p>
