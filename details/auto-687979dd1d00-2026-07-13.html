      <h1>日経平均の下げ幅が1800円を超える</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月13日、日経平均株価の下げ幅が1800円を超え、14時30分には1823.02円安の66,734.71円に達した。 この下落は、午前中の売り圧力が強まったことによるもので、特に中東情勢の影響が大きいとされている。</p>
