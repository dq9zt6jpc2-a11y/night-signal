      <h1>2024年の日本の世帯平均所得は7.3%増加も生活苦は増加、単身世帯は過去最高に</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2024年の日本の世帯平均所得は前年比7.3%増の575万2000円となり、1990年代のピークには届かなかったものの大幅な増加を示した。 世帯所得の中央値も410万円から451万円に上昇したが、生活が「苦しい」と感じる割合は55.4%で、2022年調査から4.1ポイント増加した。 単身世帯の数は1947万7000世帯で全体の35.4%を占め、いずれも過去最高を更新した。</p>
