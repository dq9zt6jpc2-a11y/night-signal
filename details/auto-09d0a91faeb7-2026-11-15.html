      <h1>幾田りら、水上恒司と映画『くろねこ』でW主演 2027年5月14日公開</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>11月13日発表のオリジナル映画『くろねこ』は2027年5月14日公開で、水上恒司と幾田りらがW主演を務め、幾田にとって実写作品での本格演技と映画主演はいずれも初となる。 脚本は渡辺あや氏、監督は井上剛氏で、特報映像と新ビジュアルも公開された。 幾田は約10カ月前から演技レッスンを始め、劇中では髪を青く染める。</p>
