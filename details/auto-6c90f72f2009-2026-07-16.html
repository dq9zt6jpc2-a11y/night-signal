      <h1>日経平均株価、前日比1915.97円安の66835.54円</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>下げ幅は一時2200円を超え、前日の米半導体株安と韓国KOSPIの7％超急落が売りを強めました。 TSMCが市場予想を上回る決算を発表した後も半導体株への売りが続き、東証プライムの売買代金は9兆5639.84億円でした。</p>
