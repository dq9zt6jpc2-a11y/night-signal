      <h1>ラピダスの半導体量産計画に不安の声、成功確率は低いとの見方</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ラピダス社が政府からの支援を受けて2ナノメートルの半導体量産を目指しているが、業界関係者はその成功確率を2〜3割と見積もっている。 経済産業省は、ラピダスの成功に対して予防線を張り始めており、量産の実現には多くの課題が残っていると指摘している。 ラピダスは2027年度までに約2.9兆円の支援を受け、2029年には1.4ナノメートルの量産も視野に入れているが、実績のない企業がTSMCと同様の成果を上げることは難しいとされている。</p>
