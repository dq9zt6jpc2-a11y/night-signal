      <h1>フランス企業GroundspaceがウクライナでStarlink検出器の試験を計画</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>フランスのスタートアップGroundspaceは、ウクライナでStarlink衛星端末検出器WHISPRの試験を計画している。 WHISPRは車両搭載型で最大25キロメートルの範囲で衛星端末信号を検出可能で、ポータブル版Scoutもある。 このシステムは前線での敵通信機器検出よりも、Starlink端末を搭載したロシアの偵察ドローンや自爆ドローンの検出に利用される可能性が高い。</p>
