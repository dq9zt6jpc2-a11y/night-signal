      <h1>FIA、角田裕毅のモンツァ10位を巡る控訴審を11月25日に設定</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Audiが角田裕毅のイタリアGP10位を不服とした控訴について、FIA国際控訴裁判所は11月25日にパリで審理する。 Audiは追加フォーメーションラップ後のピットレーンスタートを定めた競技規則B5.9.4の適用を問題視したが、当日の審査委員は追加周回の原因を角田と明示する通知がなかったとして処分を見送っていた。</p>
