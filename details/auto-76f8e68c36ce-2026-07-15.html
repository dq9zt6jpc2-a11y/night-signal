      <h1>経産省、妙高市の半導体企業に最大1600億円支援を発表</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>経済産業省は妙高市に工場を持つイスラエル本社の半導体企業タワーセミコンダクターに最大1600億円の支援を決定した。 同社は光通信用半導体の世界シェア約8割を占め、妙高市と富山県魚津市で約6000億円を投資して量産を開始する計画。 支援の条件として、投資完了後10年間の生産継続と国内供給不足時の政府増産要請への対応が求められている。</p>
