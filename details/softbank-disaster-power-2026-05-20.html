      <h1>SoftBank、6月1日開始の災害時電源配送で通信復旧力を補強</h1>

      <h2>30秒概要</h2>
      <div class="summary-lead">SoftBankは2026年6月1日から、災害時に避難所へモバイルバッテリーや充電ケーブルを届ける連携を始める。AIデータセンター向けの大規模蓄電とは別の論点だが、通信インフラの復旧力を電源面から補う点で重要だ。停電や避難所通信では、基地局や端末そのものより、最後に使える電源がボトルネックになりやすい。</div>
