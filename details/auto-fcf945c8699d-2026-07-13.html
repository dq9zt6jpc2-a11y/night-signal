      <h2>概要</h2>
      <div class="article-summary">
        <p>13日午後5時現在の円相場は1ドル=162円08～10銭で、前週末の161円69～70銭から39銭の円安となった。 円相場は162円台前半で推移しており、今後の市場動向に注目が集まっている。</p>
