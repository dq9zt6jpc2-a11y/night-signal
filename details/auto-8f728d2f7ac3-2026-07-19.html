      <h1>ウクライナ、Starlink端末の登録規則を厳格化</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>新規登録ではKIT番号とUTIDの記載を必須とし、個人と個人事業主は登録する全端末を行政サービスセンターへ提示する必要がある。 一般企業の登録上限は10台で、重要企業は上限対象外となる。 法人がオンライン手続きを使う条件は、登録後1カ月から1年以上へ厳格化された。 端末の削除と登録情報取得のサービスを追加し、一時・永住許可を持つ外国人にも行政サービスセンター経由の申請を認める。</p>
