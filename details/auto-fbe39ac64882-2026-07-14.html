      <h1>米国6月CPI発表を控えたドル円相場の見通し</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>米国6月の消費者物価指数（CPI）の発表が予定されており、前年比+3.8%と予想されています。 コアCPIは前年比+2.8%と予想されており、前月からの鈍化が見込まれています。 CPIの結果次第でドル円相場が変動する可能性があり、特に163円または161円の範囲での動きが予想されています。</p>
