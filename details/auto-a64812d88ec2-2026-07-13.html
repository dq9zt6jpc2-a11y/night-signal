      <h2>概要</h2>
      <div class="article-summary">
        <p>検察は、リー氏が事件後にChatGPTを数十回利用し、証拠隠滅の方法や911通報時の対応を相談していたと主張。 AIとのやりとりが裁判の重要な証拠となっている。 死因は脳損傷や刺し傷など複数の重傷で、リー氏の説明する事故死とは矛盾。 弁護側は証拠の取得過程を精査し、無罪を主張する方針。 被害者家族は5000万ドルの損害賠償請求も提起している。</p>
