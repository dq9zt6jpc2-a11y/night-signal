      <h1>Honda/HRC、安田啓一氏を2027年1月1日付社長に</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>関連リンクは、Honda/HRCが安田啓一氏を2027年1月1日付で代表取締役社長にすると伝えている。 同じ関連リンクは、渡辺康治氏が退任すると伝えている。 渡辺氏は2020年当時、Hondaの第4期F1活動を2021年で終了すると発表した。 渡辺氏はその後、新生HRCの社長に就任した。 HRCはRed Bull F1への供給を継続し、Max Verstappenの4連覇を支えた。</p>
