      <h1>中国の自動車輸出が6月に初めて100万台を突破</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中国の自動車輸出が6月に103.7万台に達し、初めて月間100万台を突破した。 2026年上半期の自動車輸出は509.6万台で、前年比65.3%の増加を記録した。 6月の輸出のうち、電気自動車は52.3万台で、前年比1.6倍の成長を示した。</p>
