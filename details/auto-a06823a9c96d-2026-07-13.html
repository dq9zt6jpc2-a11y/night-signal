      <h1>米株式市場はCPI鈍化予想と決算発表を注視、金融・ハイテク株に動き</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>米株式市場は先物が軟調で売り先行の見通し。 中東情勢の不透明感や原油高が売り要因となる一方、明日発表のCPIは鈍化が予想され、FRBの早期利上げ観測が後退する可能性がある。 長期金利の上昇が抑制されればハイテク関連株に買いが入りやすく、相場を支える見通し。 今週から企業決算が始まり、金融セクターへの物色も予想される。</p>
