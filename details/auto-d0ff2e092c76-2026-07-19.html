      <h1>ソフトバンク、OpenAI活用の脆弱性対策を3000社へ拡大</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>法人向け「Patching as a Service」の対象を3000社に広げ、脆弱性診断からレポート、対策提案、パッチ作成・適用までを一体提供する。 先行診断ではソースコード1000万行当たり平均約280件の潜在的脆弱性を検出し、その25％は早急な対応が必要となり得る高リスクだった。 ソフトバンクはAIサイバー防衛室とSB OAI Japanを合わせ約1000人の体制で提供を進める。</p>
