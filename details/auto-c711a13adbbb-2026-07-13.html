      <h2>概要</h2>
      <div class="article-summary">
        <p>中国政府は現代流通システムの構築を加速し、流通コストの引き下げを目指す方針を示した。 2026年7月10日の国務院常務会議で、現代流通システムの整備状況報告を聴取し、効率的かつ円滑な流通体制の推進を決定した。</p>
