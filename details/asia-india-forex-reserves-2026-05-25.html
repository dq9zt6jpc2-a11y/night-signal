      <h1>インドの外貨準備高は80.94億ドル減、5月15日時点で6888.94億ドル</h1>

      <h2>30秒概要</h2>
      <div class="summary-lead">5月22日に公表されたRBI統計に基づく報道によると、インドの外貨準備高は5月15日までの1週間に80.94億ドル減少し、6888.94億ドルとなった。外貨資産は64.83億ドル減の5459.04億ドルで、金準備も減少した。外貨準備高の週次減少は、通貨市場の変動時にインドが持つ外貨の余力に関わる経済指標である。</div>
