      <h1>ドル円はアジア市場で一時159.06付近まで上昇</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>ドル円はアジア市場で一時159.06付近まで上昇したあと、ロンドンで159円を挟んでもみ合っている。 ユーロ円はアジア市場で堅調に推移したあと、ロンドンで一段高となり、一時174.97付近まで上昇した。 USD/JPYは158.94、EUR/JPYは174.86だった。</p>
