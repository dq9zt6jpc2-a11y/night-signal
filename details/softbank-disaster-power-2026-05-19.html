      <h1>SoftBank、6月1日から災害時モバイルバッテリー配送連携を開始</h1>

      <h2>30秒概要</h2>
      <div class="summary-lead">SoftBankは2026年6月1日から、大規模災害時に避難所などへモバイルバッテリーや充電ケーブルを届ける連携協定を始める。通信障害や停電が起きた現場では、スマートフォンの電源確保が情報収集、安否確認、行政連絡の前提になる。AIデータセンター向けの大規模蓄電とは用途が違うが、SoftBankの電源テーマは平時のAIインフラと非常時の生活インフラの両方に広がった。</div>
