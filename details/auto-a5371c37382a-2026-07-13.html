      <h1>MUFGが40年ぶりに日本の時価総額首位に、トヨタを抜く</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>三菱UFJフィナンシャル・グループ（MUFG）が、トヨタ自動車を抜いて日本の時価総額首位に立った。 MUFGの時価総額は41兆9,048億円に達し、トヨタは40兆8,659億円、キオクシアは36兆5,831億円である。 MUFGの時価総額首位獲得は、日本銀行の金融政策正常化が影響している。 MUFGは、米国およびアジア事業の成長により、業務純益の半分以上を占めている。 日本市場の主力銘柄が自動車からAI、半導体、金融へと広がりを見せている。</p>
