      <h1>韓国のKOSPI、米国のCPIと半導体業績に注目</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>韓国のKOSPIは、米国のCPIや半導体の業績、韓国銀行の政策決定会議に注目が集まっている。 KOSPIは7月10日に2.52%上昇したが、週全体では7%以上の下落を記録している。 米国のCPIデータが市場に与える影響が注目されており、特にインフレ率が予想を下回る場合、KOSPIの反発が期待される。</p>
