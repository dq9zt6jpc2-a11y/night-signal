      <h2>記事まとめ</h2>
      <div class="article-summary">幾田りらの2nd Album『Laugh』関連では、国内公演から韓国公演までのツアー情報が公式ページにまとまっている。YOASOBI本体の発表と幾田りらソロの発表は対象が異なり、公式HP、スタッフX、YouTubeでは告知の主体と内容が分かれている。6月1日号では、新曲発表や大型タイアップではなく、ソロ名義のライブ日程と終了後の写真・映像発信を確認対象にした。</div>
