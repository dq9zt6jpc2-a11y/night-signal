      <h1>SpaceX株が上場後初めてIPO価格135ドルを下回る</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>SpaceX株は7月15日に取引中132.15ドルまで下落し、6月のIPO価格135ドルを初めて割り込んだ。 同社株は高値から約41％下落し、7月下旬から8月上旬に見込まれる段階的なロックアップ解除への警戒も強まっている。</p>
