      <h1>SpaceX、Vandenbergで2026年50回目の打ち上げ</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Vandenbergでは7月1日と10日にもFalcon 9によるStarlink打ち上げが行われ、7月21日の飛行がカリフォルニア州で2026年50回目の打ち上げとなった。 別のStarlinkミッションはエンジン点火後に直前中止となったが、SpaceXは機体とペイロードが安全だと説明した。 当初の離昇予定は米東部時間7時49分だった。</p>
