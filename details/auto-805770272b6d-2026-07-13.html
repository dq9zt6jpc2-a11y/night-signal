      <h1>日本株の夏の投資戦略：業績好調も高値波乱が続く中での対応策</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>日本株は業績が好調であるものの、金利上昇や外国人投資家の売り越しが影響し、高値波乱が続いている。 特に半導体株が影響を受け、1週間で3.9%下落した。 企業業績は好調で、特に非製造業のDIは+37と非常に好調であるが、金利上昇が懸念材料となっている。 日本の長期金利は一時3%に近づいたが、GPIFによる国内金融資産への投資が期待され、金利は低下した。 今後の投資戦略として、出遅れの好業績小型株を買うことが推奨されている。</p>
