      <h1>STARSHIPのミッキー・トーマス参加アルバム「OVER THE EDGE」が22年ぶりにリイシュー</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>STARSHIPのシンガー、ミッキー・トーマスをフィーチャーしたメロディアス・ハードのアルバム「OVER THE EDGE」が22年ぶりにリイシューされる。 このアルバムは2004年に発表され、リイシューは2026年8月21日にFrontiers Musicより発売される。 ニール・ショーンが参加した楽曲“Surrender”のヴィジュアライザーも公開された。</p>
