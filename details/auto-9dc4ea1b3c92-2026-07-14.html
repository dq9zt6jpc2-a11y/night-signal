      <h1>フェラーリ、新サーキット「マドリング」で初走行を実施</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>フェラーリが新しいF1サーキット「マドリング」で初の実走テストを実施しました。 このテストは、9月に予定されているスペインGPに向けた運営面の総合リハーサルとして行われました。 テストでは、アスファルトの状態、安全手順、通信、マーシャルの対応などが確認されました。 現在も建設作業が進行中であり、FIAの最終公認検査が控えています。</p>
