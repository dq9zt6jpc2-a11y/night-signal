      <h1>日銀、資金循環統計の遡及改定予定を5月25日に公表</h1>

      <h2>30秒概要</h2>
      <div class="summary-lead">日本銀行は5月25日、新着情報の統計欄に「Planned Retroactive Revision to the Flow of Funds Accounts」を掲載した。日銀サイトは資金循環統計を統計メニューに掲載し、同日表示の金融政策情報として、無担保コール翌日物を0.75%程度に誘導する方針と、次回金融政策決定会合を6月15日・16日に開催する予定も示している。</div>
