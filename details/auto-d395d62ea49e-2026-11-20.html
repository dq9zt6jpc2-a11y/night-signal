      <h1>60代前半世帯、教育・仕送り減でも支出差は月4万円</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>2025年家計調査の平均では、夫50～54歳世帯の消費支出は月39万9715円、60～64歳世帯は35万9527円で、差は4万188円だった。 教育費と仕送りは月4万6893円減る一方、その他支出は6705円増え、60～64歳世帯では交際費が9251円、住居費が6117円多かった。 世帯人員や有業人員が異なる平均同士の比較である。</p>
