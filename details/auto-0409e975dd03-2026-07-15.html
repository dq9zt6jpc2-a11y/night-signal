      <h1>日本株式市場は半導体急落でも市場全体の影響は限定的</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>日本の時価総額上位3社は業種が分散しており、日経平均構成銘柄の上位3銘柄の時価総額比率は約9％であるのに対し、韓国の上位3銘柄は約53％を占めている。 日本市場では銀行など15業種が上昇し、市場全体の下落幅を抑えた。 韓国では個別銘柄の1日の騰落率を2倍で追随するレバレッジETFが存在するが、日本にはない。 金融監督院長は韓国の単一銘柄レバレッジETFの副作用を指摘している。</p>
