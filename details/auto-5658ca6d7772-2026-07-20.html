      <h1>中国、アジア最大級の浚渫船「浚広」を稼働</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>中国の中交広州航道局が運用する、独自設計・開発・建造のドラグサクション浚渫船「浚広」が引き渡され、稼働を開始した。 全長198メートル、最大掘削深度120メートル、載貨重量6万483トンで、アジア最大級とされる。 世界初の角度調整可能なデュアル・バウ・ジェッティング、ワンクリック浚渫、浚渫・航行統合制御を搭載し、作業の全自動制御を実現した。 港湾・航路の浚渫、深海採砂、海底ケーブルやパイプ用の溝掘削・埋め戻し、深海パイプライン施工に利用できる。</p>
