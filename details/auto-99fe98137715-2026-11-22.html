      <h1>米下院、MicrosoftとByteDanceのAI契約交渉について説明要請</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>米下院中国特別委員会は11月18日、MicrosoftにByteDanceとの交渉内容を超党派の委員へ説明するよう求めた。 委員長は、Microsoftが米国防総省と契約していることを理由に、ByteDanceへAIツールを販売すべきでないと述べた。 11月21日の記事時点でMicrosoftとByteDanceの交渉は成立しておらず、取引条件と議会説明後の扱いも確定していない。</p>
