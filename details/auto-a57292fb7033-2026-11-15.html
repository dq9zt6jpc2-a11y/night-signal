      <h1>グローバル・リンク・マネジメント、年間配当を110円へ増額</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>同社は2026年12月期の年間配当予想を前回から10円、前期から29.5円増の1株110円へ引き上げ、予想配当利回りは5.83%となった。 増収増益への業績予想修正を受け、配当性向30%を目標とする累進配当方針に沿って5期連続増配を見込む。</p>
