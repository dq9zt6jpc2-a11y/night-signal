      <h1>FIA会長がホーナーのF1復帰先決定を示唆 ホーナーは勝利を目指せるチーム復帰を強調</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>FIA会長モハメド・ベン・スレイエムは、レッドブル元代表クリスチャン・ホーナーのF1復帰先が既に決まっている可能性を示唆した。 ホーナーは現在複数のプロジェクトと関係が取り沙汰されており、復帰に向けた話し合いが始まっているが、復帰先や時期については明言を避けている。 ホーナーは復帰するなら勝利を目指せるチームでなければならず、急いでいないと述べ、BYD支援の新チーム参画説には具体的な言及を避けた。</p>
