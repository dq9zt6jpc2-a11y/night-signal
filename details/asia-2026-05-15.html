      <h1>インドCPIとASEAN投資動向をまとめて確認する</h1>

      <h2>30秒概要</h2>
      <div class="summary-lead">インド4月CPIは物価・金利・為替の読み筋に直結する。ベトナム/ASEAN側はFDI、PMI、日系企業投資、工場建設を合わせて確認し、地域全体の成長モメンタムを見る。</div>

      <h2>読むポイント</h2>
      <ul>
        <li><strong>公式データ</strong>: CPI（前年比）を一次ソースで固定</li>
        <li><strong>主要報道</strong>: 見出しの解釈を鵜呑みにせず、数字との整合を確認</li>
        <li><strong>予定</strong>: 次の統計・会合・入札などの発表予定を確認</li>
      </ul>
