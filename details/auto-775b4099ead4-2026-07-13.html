      <h1>FIA、2027-2028年のF1エンジン使用制限を緩和へ</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>FIAは2027年と2028年のF1エンジン規則を改定し、内燃機関（ICE）、ターボチャージャー、排気システム、MGU-K、バッテリー、ECUの使用制限を緩和した。 これによりエンジンメーカーは2年目と3年目のパワーユニット使用においてより柔軟な運用が可能となる。</p>
