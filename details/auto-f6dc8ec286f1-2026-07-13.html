      <h1>ｉシェアーズ米国債券ETF複数銘柄が2026年8月19日より収益分配金支払い予定</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ｉシェアーズ 米国総合債券ETF（2256）は、2026年8月19日から10口につき20円の収益分配金を支払う予定。 ｉシェアーズ 米国債20年超ETF（為替ヘッジあり・2621）は、2026年8月19日から1口につき12円の収益分配金を支払う予定。 収益分配金の計算期間は2026年2月27日～2026年7月11日、または2026年4月12日～2026年7月11日。</p>
