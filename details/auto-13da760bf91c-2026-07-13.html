      <h1>東京市場でドル・円が失速、米金利動向と中東情勢が影響</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月13日午後の東京市場でドル・円は失速し、162円付近までやや値を下げた。 中東情勢の混迷による原油高がドル買いを促す要因となっているが、米長期金利の上昇が一服したことでドル買いが弱まっている。 明日の米インフレ指標発表を控え、市場は様子見ムードとなっている。 ドル・円の取引レンジは161円76銭から162円17銭、ユーロ・円は184円46銭から184円75銭、ユーロ・ドルは1.1384ドルから1.1405ドルで推移した。</p>
