      <h1>日本政府、教育予算をGDPの5%に引き上げる計画を発表</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>日本政府は、教育予算を今後5年間で国内総生産（GDP）の5%に引き上げる計画を発表した。 この政策は、教育への投資を増やし、国の教育システムを強化することを目的としている。</p>
