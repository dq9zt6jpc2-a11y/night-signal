      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>7月16日の終値は131.11ドルとなり、上場から約1カ月で公開価格135ドルを割り込んだ。 6月16日の上場来高値終値から時価総額は約9030億ドル減り、下落率は約3分の1に達した。 上場後3営業日で米個人投資家は3億7000万ドル、上場初日に韓国の個人投資家は約8億ドルを買い越したとされる。</p>
