      <h1>Kenanga Research、2026年のGDP成長率を引き上げ、失業率予測を維持</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>Kenanga Researchは2026年の失業率予測を2.9%に維持し、GDP成長率予測を4.5-5.0%に引き上げた。 労働市場の堅調さと国内需要の強化が、経済成長の主要な要因とされている。 マレーシアの失業率は5月に3.0%で変わらず、雇用は4ヶ月連続で0.1%増加している。</p>
