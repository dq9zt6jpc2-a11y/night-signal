      <h1>中国の上半期GDPは4.7％増、第2四半期は4.3％へ減速</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>上半期GDPは約69兆5700億元で、政府の年間目標4.5～5％の範囲に入りました。 6月の都市部失業率は5.0％へ低下し、上半期の1人当たり可処分所得は5.2％増加しました。</p>
