      <h1>米従業員エンゲージメント、第3四半期29％</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Gallup調査では、仕事・職場への関与度が高い米従業員は第3四半期に29％となり、2011年以降で最低水準だった。 9月の離職率は2.1％で過去12カ月平均の約2％を上回ったが、大退職期より低い。 採用率は3.4％で2カ月連続上昇したものの、2010年代初頭並みにとどまった。 専門家は採用低迷により転職機会が狭まり、現職への不満を解消しにくい状況だと分析した。</p>
