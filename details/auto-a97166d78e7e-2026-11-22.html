      <div class="article-summary">
        <p>Anthropicの上場を受け、アジアのAI・半導体関連株に売りが広がった。 SoftBank Group株は20日に16.16%安となり、東京エレクトロンやSK hynixなど日韓の主要銘柄も下落した。 NVIDIAに部品を供給するSK hynixとSamsung Electronicsは、それぞれ6.0%、4.7%下落した。</p>
