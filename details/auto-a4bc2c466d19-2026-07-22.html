      <h1>円が1ドル163円台へ下落、中東有事と政策不安が重なる</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>中東情勢の悪化と米金利上昇でドルが買われ、円は1ドル163円台前半と1986年12月以来の安値を更新した。 カザフスタン産原油への懸念で北海ブレントは1バレル92ドル目前まで上昇する一方、米SOX指数は半導体株の買い戻しで5.2%上昇した。</p>
