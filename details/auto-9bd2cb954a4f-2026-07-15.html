      <h1>北海道でブランド米「ななつぼし」が559円の大幅値下げ、コメの在庫過多が背景</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>北海道札幌市のスーパーでブランド米「ななつぼし」5キロが559円の大幅値下げで3218円で販売されている。 「ふっくりんこ」や「おぼろづき」も500円から600円ほど値下げされた。 値下げの背景にはコメの在庫過多による危機感がある。</p>
