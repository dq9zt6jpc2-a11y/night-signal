      <h1>中国能建葛洲坝グループと江西投資グループが新エネルギー・蓄電分野で協力深化</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中国能建葛洲坝グループと江西投資グループが、抽水蓄能、蓄電、新エネルギー分野での協力深化に合意。 両社は水利水電、抽水蓄能、新型蓄電、水泥建材など重点分野で協力を拡大し、代表的プロジェクトの共同推進を計画。 江西投資グループは省内のエネルギー保障・投資プラットフォームとして、新エネルギー・新型蓄電分野の新質生産力育成を加速している。</p>
