      <h1>F1王者アントネッリ、イタリア大統領に署名ヘルメットを贈呈</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>2026年F1王者アンドレア・キミ・アントネッリは11月13日、ローマでセルジョ・マッタレッラ大統領と面会し、署名入りMercedesヘルメットを贈って2027年イタリアGPへ招待した。 記事はイタリア人のF1世界王者が1953年以来だったと説明している。 イタリア人ドライバーの前回の王者は、1953年に2連覇したAlberto Ascariだった。 2027年シーズンはアントネッリがタイトル防衛に挑む年となる。</p>
