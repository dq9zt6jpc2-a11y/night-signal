      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>現地11月19日のFP2でGeorge Russellが1分47秒272で首位、Pierre Gaslyが0.071秒差の2位、Charles Leclercが0.333秒差の3位だった。 Fernando Alonsoは10位、Lance StrollはAlonsoから0.551秒差の11位。 Max Verstappenは9周のみで13位だった。 FP3は日本時間11月21日午前9時30分から1時間実施される。</p>
