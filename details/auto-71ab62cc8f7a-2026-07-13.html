      <h1>ソフトバンク、楽天戦で初回7点の猛攻 牧原大成が2号3ラン含む活躍</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ソフトバンクは7月11日の楽天戦で初回に7点を先制する猛攻を見せ、牧原大成が2号3ランを放つなど打者一巡の攻撃で大勝した。 この試合でソフトバンクは楽天の先発投手ウレーニャを攻め立て、正木、周東、近藤、柳田、牧原大成、周東が次々と安打を放ち、ビッグイニングを作り出した。</p>
