      <h1>中国のM2供給量が急増、経済成長の新たなドライバーに注目が集まる</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>M2の増加は主に政府の直接融資によるもので、特に政府発行の債券が重要な役割を果たしている。 2025年には、M2のGDPに対する比率が242.7%に達し、これは主要経済圏の中で最も高い数値である。 中国の経済成長は、過去30年間にわたり負の成長を経験しておらず、これは異常な投資によるものである。 今後のM2の成長を抑制するためには、経済の質を向上させ、経済の転換を進める必要がある。</p>
