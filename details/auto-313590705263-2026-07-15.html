      <h1>日経平均が2日連続で1000円超上昇、半導体関連株が牽引</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>米国の6月消費者物価指数の上昇率が市場予想を下回り、FRBの早期利上げ観測が後退したことを好感し、半導体関連株を中心に幅広い銘柄が買われた。 東証プライム銘柄の7割超が値上がりし、東証株価指数（TOPIX）は49.14ポイント（1.22％）高の4088.12となった。 半導体関連株の寄与度が大きい韓国の株価指数の大幅上昇も日本株の追い風となった。</p>
