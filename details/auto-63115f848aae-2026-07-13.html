      <h1>日本のガラス・土石業界が半導体・AI素材セクターとして注目され、成長が期待される。</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>日本の「ガラス・土石」業界が半導体やAI素材セクターとして注目されており、AGCや日本電気硝子、NGK、MARUWAが高機能ガラスやセラミックス製品を提供している。 これらの企業はAIやデータセンターの需要増加に伴い、成長が期待されている。 「ガラス・土石」業界は従来の建設株のイメージから、半導体・AI素材セクターとしての評価が高まっている。</p>
