      <h1>中国で人型ロボットの実用化と教育機関の開校、急速な成長予測</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中国・杭州に国内初の「ロボットのための学校」が開校した。 中国の人型ロボットが生体に低侵襲手術を実施し、6日間の工場勤務で99％の作業成功率を達成した。 今後10年で中国の人型ロボット出荷台数が70倍に増加する見込みが報じられている。</p>
