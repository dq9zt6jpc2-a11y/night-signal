      <h1>中国と老挝が農業環境分野で協力MOU締結、無人機工場建設へ</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月7日、中国龍魂実業発展集団有限公司と老挝人民民主共和国農業環境部が、農業環境分野での協力に関するMOUを老挝首都ビエンチャンで締結した。 両国は老挝に無人機（ドローン）組立工場を建設し、農業、土地測量、森林防火、農村緊急救援、環境監視などに対応する低空飛行管理制御システムの開発を進める。</p>
