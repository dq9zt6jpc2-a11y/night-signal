      <h1>韓国半導体株のレバレッジ解消が日本株急落を増幅</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>KOSPIは6月30日終値から7月16日終値まで19.5％下落し、2026年に5％以上下落した日は14回に達した。 韓国で人気化した個別半導体株のレバレッジ型ETFの巻き戻しが、SKハイニックスやサムスン電子と連動性の高い日本のAI・半導体株の下落を増幅したとの分析が示された。</p>
