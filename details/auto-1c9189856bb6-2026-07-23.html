      <h1>米関税を受け米加共同のGordie Howe橋開通式を中止</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Trump政権がカナダ輸入品へ50％関税を課したことを受け、カナダは米国との共同開通式を中止した。 Windsor市長は緊張を不要だとし、両国間の橋梁協定は変更されていない。 橋は7月27日に開通予定で、カナダ側は7月24日に国内で節目を祝う。</p>
