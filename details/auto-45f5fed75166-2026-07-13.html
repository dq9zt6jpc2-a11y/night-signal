      <h1>Sansan、2027年5月期に経常利益125億～145億円の見通しと2.5円増配を発表</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>Sansanの2026年5月期の連結経常利益は前年の3倍の81.7億円に達し、2027年5月期は125億～145億円の見通しで、13期連続増収、4期連続増益を予想している。 2027年5月期の年間配当は前期比2.5円増の5円に大幅増配する方針を示した。 2026年3～5月期の連結経常利益は前年同期比2.5倍の22.3億円に急拡大し、売上営業利益率は7.5％から15.4％に改善した。</p>
