      <h1>ASEAN、デジタル経済枠組み協定DEFAを11カ国で署名</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>シンガポール当局は、DEFAをASEAN初の独立した法的拘束力のあるデジタル経済協定と説明している。 ASEANは2023年9月に交渉を開始し、2026年5月に妥結した。 ASEAN全11加盟国が2026年11月14日に署名し、署名後180日で発効する日程では2027年5月13日となる。</p>
