      <h1>兵庫県知事が338億円の県債不適切処理について説明する</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>兵庫県の斎藤元彦知事は、338億円の県債の不適切な会計処理について、前知事との協議に基づく指示があったと説明した。 県債は約26年前に公用地購入のために発行され、2020年度に地方財政法に抵触する処理が行われた。 返済の財源があるにもかかわらず、返済に充てずに基金に積み立て、借り換えを行ったことが問題視されている。</p>
