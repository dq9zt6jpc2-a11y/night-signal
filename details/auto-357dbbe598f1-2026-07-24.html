      <h1>Aston Martin、HPSから5億5000万ポンドを調達</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Aston Martinは、BlackRock傘下のHPS Investment Partnersから5億5000万ポンドの資金調達枠を確保した。 内訳は4億5000万ポンドの優先担保付タームローンと、1億ポンドの遅延実行型タームローンで、別に1億ポンドの追加借入余地を設ける。 これにより6月末時点の流動性は約3億4000万ポンドとなり、中国需要の低迷と米国関税による販売圧力への備えを厚くする。</p>
