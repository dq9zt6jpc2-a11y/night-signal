      <h1>5月PMIは50、受注は49.9に低下</h1>

      <h2>記事まとめ</h2>
      <div class="article-summary">
        <p>AP報道（WTOP配信）によると、中国の国家統計局が公表した5月の製造業PMIは50で、4月の50.3から鈍化した。50を上回れば拡大、下回れば縮小を示す。</p>
        <p>内訳では新規受注が49.9（4月50.6）へ低下し、原材料在庫も48.6（49.3）へ下がった。一方、生産指数は51.2（51.5）と拡大圏を維持した。</p>
        <p>記事は、エネルギー価格や外需、内需の弱さといった要因に言及し、景気の下振れリスクが残る点を整理している。</p>
