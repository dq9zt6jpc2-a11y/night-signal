      <h1>NTTドコモの「docomo Starlink Direct」、接続者数500万人を突破</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>NTTドコモは、SpaceXのStarlink Mobileを利用した衛星通信サービス「docomo Starlink Direct」の接続者数が、サービス開始から約2カ月で500万人を突破したと発表しました。 NTTドコモの「docomo Starlink Direct」は、他社と異なり一律無料で提供されており、対応機種は89機種で2500万台以上に達しています。</p>
