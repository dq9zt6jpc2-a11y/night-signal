      <h1>中国4～6月GDP、製造業の内訳は加速</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>実質GDP成長率は1～3月の5.0％から4～6月に4.3％へ減速した一方、名目ベースの4～6月GDPは前年同期比5.9％増となった。 一定規模以上の設備製造業の付加価値は9.7％、ハイテク製造業は14％増え、電子製品産業は4～6月に16.1％増加した。 4～6月のGDP増加額は2兆元で、1～3月より4000億元多かった。</p>
