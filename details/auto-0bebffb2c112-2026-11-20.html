      <h1>三井化学、JSR買収総額1兆8400億円 のれん約9000億円</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>三井化学によるJSR買収総額は1兆8400億円で、自社の企業価値を上回る。 買収により約9000億円ののれんが発生し、負債も増える見通しだ。 株価は買収公表直前の11月2日終値から20％下落し、同期間の日経平均の6％安を上回った。</p>
