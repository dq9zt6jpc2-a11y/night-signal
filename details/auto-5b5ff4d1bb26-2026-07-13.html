      <h2>概要</h2>
      <div class="article-summary">
        <p>リバティウォークが手掛けたJDMチューンのホンダ・シビックタイプRは、ワイドボディキットを使わずにアグレッシブな外観を実現している。 エアサスペンションや新しいホイール、赤いブレーキキャリパーなどの装備が特徴で、車高を下げたローダウン仕様となっている。 パワートレインはノーマルの2.0リッターターボエンジン（315馬力）を維持している。</p>
