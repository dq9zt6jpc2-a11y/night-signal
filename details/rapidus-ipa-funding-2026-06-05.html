      <h1>Rapidus、政府系IPAから1500億円の追加出資を完了</h1>

      <h2>30秒概要</h2>
      <div class="article-summary">Rapidusは6月5日、情報処理推進機構（IPA）から1500億円の追加出資を完了したと発表した。IPAは経済産業省所管の独立行政法人で、情報処理の促進に関する法律に基づく出資となる。Rapidusは既にIPAから1000億円、民間32社を含む1676億円の資金を受けており、今回の増資後の資金調達総額は4249.5億円に達した。2027年の最先端半導体量産に向け、政府資本が研究開発から量産準備までを支える構図が一段と濃くなった。</div>
