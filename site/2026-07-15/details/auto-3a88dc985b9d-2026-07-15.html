      <h1>6月の米消費者物価指数、前年比3.5%上昇で大幅鈍化</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年6月の米消費者物価指数（CPI）は前年同月比3.5%上昇し、ガソリン価格の高騰が一服したことで前月比では下落した。 原油価格の下落によりインフレ率の伸びが3年ぶりに大幅に鈍化し、市場にインフレのピークアウト期待が広がっている。</p>
