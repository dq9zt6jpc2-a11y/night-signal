      <h1>SpaceXが第3世代Starlink衛星10万基のFCC認可を申請</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>SpaceXは米連邦通信委員会（FCC）に最大10万基の第3世代Starlink衛星の認可を申請した。 第3世代衛星は第2世代衛星と比べて10倍の性能向上を目指し、AIのリアルタイム意思決定や産業オートメーションに必要な大容量アップリンクを支えることを目的としている。 BNPパリバは第3世代衛星が完成すれば世界で2億人の加入者にサービス提供可能と試算し、そのうち約1,500万～2,000万人が米国利用者になると見込んでいる。</p>
