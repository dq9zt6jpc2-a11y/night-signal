      <h1>テンシャル、2026年8月期第3四半期累計経常利益は26.8億円で進捗率70.9％</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>テンシャルは2026年8月期第3四半期累計の経常利益が26.8億円となり、通期計画の37.9億円に対する進捗率は70.9％となった。 直近3ヵ月の経常利益は5億円であった。</p>
