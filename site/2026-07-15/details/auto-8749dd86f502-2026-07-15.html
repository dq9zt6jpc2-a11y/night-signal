      <div class="article-summary">
        <p>シーラホールディングスは2026年5月期の連結経常利益が前期比9.3倍の20.6億円に急拡大し、2027年5月期は23.7億～25億円の見通しと発表した。 第3四半期累計でも18.8億円の赤字となっている。</p>
