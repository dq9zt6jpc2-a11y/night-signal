      <h1>SHIFTが上場来初の配当を実施、利益予想は減少も売上高は増加へ</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ソフトウエアテスト大手のSHIFTは2026年8月期に上場以来初の配当を実施し、年間4.1円と発表した。 同時に2026年8月期の連結調整後純利益予想を前期比17%減の90億円に引き下げたが、売上高は23%増の1600億円に上方修正した。</p>
