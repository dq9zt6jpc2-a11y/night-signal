      <h1>政府の骨太方針最終案、日銀自主性尊重を明記し安全保障・社会保障の具体化進む</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>政府は2026年7月21日に閣議決定予定の「骨太の方針」最終案で、日銀の金融政策の自主性尊重を明記し、政府の金融政策介入の意図がないことを明確化した。 安全保障面では中国の軍事力強化や北朝鮮の核・ミサイル開発、ロシアのウクライナ侵略を具体的な脅威として明記した。 社会保障では2027年度の負担率が2025年度と比較して上昇しないよう取り組む数値目標を設定し、70歳以上の医療窓口負担の見直しも示した。</p>
