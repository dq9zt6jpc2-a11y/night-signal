      <h2>概要</h2>
      <div class="article-summary">
        <p>今週、米国の消費者物価指数（CPI）や連邦準備制度理事会（FRB）議長ケビン・ウォーシュの議会証言が予定されており、米ドルの回復にとって重要な試金石となる。 投資家は、これらの指標を注視しており、米ドルの動向に影響を与える可能性がある。</p>
