      <h1>中国外交部が「中国挤压」論を否定、南方諸国との協力姿勢を強調</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中国外交部は「中国挤压（中国による産業圧迫）」という一部海外メディアの主張について、事実に反するとし、グローバル南方諸国も認めないと公式に否定した。 中国は南方諸国への経験共有、インフラ・投資・技術協力、貿易市場の開放、グリーン製品の提供などを通じて、共に現代化と繁栄を目指す姿勢を強調した。</p>
