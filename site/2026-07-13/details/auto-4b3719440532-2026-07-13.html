      <h1>三菱UFJFG、時価総額42兆円で初の首位に 金融機関でバブル後初の快挙</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>三菱UFJフィナンシャル・グループが2026年7月13日に時価総額42兆円を達成し、金融機関としてバブル崩壊後初めて首位に立った。 三菱UFJの株価は一時3564円まで上昇し、時価総額は42兆1000億円台で推移している。 2026年度の連結純利益は前年度比11%増の2兆7000億円と見込まれ、日銀の追加利上げ観測が強まっている。</p>
