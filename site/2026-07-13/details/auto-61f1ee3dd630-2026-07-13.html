      <h1>ドル円相場、米物価指標が今後の動向に影響か</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ドル円相場は162円台後半での調整が続いており、米国の物価指標が今後の動向に影響を与えると予想されている。 今週の焦点は、米消費者物価指数（CPI）やFRB議長の証言で、これらがドル円の方向性を左右する可能性がある。 市場では、ガソリン価格の下落を背景にインフレ鈍化が見込まれているが、サービス価格や企業コストに根強い上昇圧力が残っている。</p>
