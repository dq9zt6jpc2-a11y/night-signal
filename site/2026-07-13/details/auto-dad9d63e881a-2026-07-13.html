      <h1>米ドル円為替相場、CPIと雇用統計が今週の重要指標に</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月第3週の米ドル円為替相場は、米国CPIや雇用関連統計の発表が大きな影響を与える見通し。 6月の米雇用統計は非農業部門雇用者数が前月差＋5.7万人と大幅減速し、先行指標でも雇用減が示唆されている。 インフレ率が2％に回帰すれば利下げ・据え置き、中東情勢やAI需要でインフレが高止まりすれば利上げの可能性がFOMC議事録で示された。 雇用関連指標の軟調が続けば、FRB内でインフレと労働市場のリスクバランス見直しが迫られる可能性がある。</p>
