      <h1>ツインバード、2027年2月期第1四半期は黒字転換、経常利益9000万円を達成</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ツインバードは2027年2月期第1四半期の決算を発表し、売上高が24億4900万円、経常利益が9000万円となり、前年同期の3億6000万円の赤字から黒字に転換した。 この黒字転換は、ツインバードの業績改善を示しており、今後の成長が期待される。</p>
