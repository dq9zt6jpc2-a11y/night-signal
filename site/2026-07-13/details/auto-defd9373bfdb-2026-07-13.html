      <h1>沖縄県が高校生失明事件で9140万円の和解金支払いを可決</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>沖縄県沖縄市で2022年1月に発生した業務上過失傷害事件に関し、県議会は2026年7月13日に約9140万円の和解金支払いを可決した。 和解金の内訳は、男性への損害賠償額が約8780万円、保険会社負担分が約360万円である。</p>
