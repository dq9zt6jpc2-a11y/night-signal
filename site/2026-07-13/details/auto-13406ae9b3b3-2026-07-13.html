      <h1>高田馬場刺殺事件の公判で、高野健一被告の消費者金融への依存が明らかに</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>高田馬場での刺殺事件の公判で、高野健一被告が消費者金融に追われ、450万円の貯金が底を突いたことが明らかになった。 被告は、女性ライバーに対して返済を懇願するLINEメッセージを送っていたことが証拠として提出された。</p>
