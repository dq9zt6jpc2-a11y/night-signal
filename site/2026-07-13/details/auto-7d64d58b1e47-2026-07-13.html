      <h1>中国とカザフスタン外相が包括的戦略協議実施へ</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中国外交部長の王毅とカザフスタン外相コシェルバエフが、首脳間の重要な共通認識の履行や両国関係の発展、国際・地域問題について踏み込んだ意見交換を行うことが発表された。 中国とカザフスタンは恒久的な包括的戦略パートナーであり、両国外相の協議は中国・カザフスタン運命共同体の構築推進に前向きな力を注入する目的がある。</p>
