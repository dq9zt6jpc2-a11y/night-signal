      <h1>プロパスト、今期経常利益3％増益と配当増額を発表で注目集まる</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>プロパストは2026年5月期の連結経常利益が前期比8.1％増の30.5億円になると発表し、2027年5月期も前期比2.6％増の31.3億円に伸びる見通しを示した。 前期の年間配当を6円から8円に増額し、今期も前期比2円増の10円に増配する方針を発表した。 直近3ヵ月の実績では、前年同期比で経常利益が85.6％増の8.5億円に拡大したが、売上営業利益率は前年同期の12.1％から8.6％に低下した。</p>
