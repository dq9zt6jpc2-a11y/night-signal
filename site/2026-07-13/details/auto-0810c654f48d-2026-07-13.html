      <h1>札幌で規格外野菜を格安販売、フードロス対策にも貢献</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>札幌市で規格外の野菜を格安で販売する「プラスフード」が、物価高対策とフードロス削減に貢献している。 トマト1キロが200円、大玉スイカが1200円で販売されており、消費者からは「安い」との声が上がっている。 この取り組みは、傷や形が整っていないが味は変わらない商品を扱い、農家から仕入れた「ハネもの」を販売している。</p>
