      <h1>アフリカのバイク市場で中国企業主導の電動化革命が進行</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中国企業の投資と技術支援により、アフリカの2000万台規模の燃油バイク市場が急速に電動化へ転換。 中国企業の進出により、アフリカは原材料輸出から電動バイクなどの製品製造へと産業構造が変化しつつある。 アフリカの二輪車市場は2030年までに5000万～6000万台規模に成長する見込みで、中国企業のサプライチェーンが大きな役割を果たしている。</p>
