      <h1>中国船舶、2026年上半期の純利益が大幅増加見込み</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中国船舶は2026年上半期の純利益が前年同期比で144%から191%増加すると予想している。 業績向上の主因は手持ち注文の充実、生産体制の成熟、精益管理の強化、コスト管理の深化、民船建造製品の数量・中高端船型比率・単船平均価格の増加による。</p>
