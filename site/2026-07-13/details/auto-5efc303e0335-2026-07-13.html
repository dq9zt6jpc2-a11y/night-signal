      <h1>米国・欧州・カナダの愛国心に関する国際世論調査結果</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>POLITICOによる国際世論調査で、米国、英国、スペイン、カナダ、フランス、ドイツの成人の多数が自国に誇りを持っていることが判明した。 各国の愛国心の表現は歴史や政治によって異なり、米国では国旗が愛国心の象徴となり、カナダでは政治指導者への誇りが強調されている。 移民や文化を巡る緊張が欧米で高まっており、右派政党が国民的アイデンティティを政治メッセージの中心に据えている。</p>
