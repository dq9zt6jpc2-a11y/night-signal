      <h1>ドル/円、片山財務相発言で円高進行もイラン情勢が影響</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>7月10日のドル/円は約0.4%下落し、片山財務相の発言により円が買われ、一時161.28円まで下落した。 イラン情勢の不透明感や米FRBの利上げ観測が影響し、ドルも買われたため、ドル/円は一方的な下落には至らなかった。 週明けにはNY原油先物価格が3%強上昇し、ドル/円は162円付近での値動きとなっている。 GPIFの運用方針変更については実現性に疑問があり、円買い材料にはならないとの見方もある。</p>
