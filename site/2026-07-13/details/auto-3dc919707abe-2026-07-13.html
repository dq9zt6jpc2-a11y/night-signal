      <h1>ドル・円は底堅いがじり安、ドル買い後退の兆し</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中東情勢の不透明感からNY原油先物が一時下落し、米長期金利の低下も影響してドル売りが進んでいる。 ドル・円の取引レンジは162円01銭から162円14銭の間で推移している。 ドル・円はじり安の傾向が見られ、ドル買いが後退している。</p>
