      <h1>日経平均が1257円安、アドテストが影響を与える</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月13日15時時点での日経平均株価は、前週末比1257円安の6万7300円で推移している。 アドテストが日経平均に240.15円の押し下げ寄与をしており、値下がり銘柄数は871に達している。 業種別では、銀行が最も値上がりし、電気機器や非鉄金属が値下がり上位に位置している。</p>
