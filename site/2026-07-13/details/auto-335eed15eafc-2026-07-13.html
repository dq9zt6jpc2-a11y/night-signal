      <h1>日経平均株価が大幅下落、韓国株安の影響で半導体関連株に売りが波及した</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月13日の東京株式市場で、日経平均株価は1315円（2%）下落し、終値は6万7242円となった。 韓国株の大幅下落が影響し、東京市場でも人工知能（AI）や半導体関連株に売りが波及した。 中東情勢の緊迫も影響し、日経平均先物に対する海外勢の売りが続いた。</p>
