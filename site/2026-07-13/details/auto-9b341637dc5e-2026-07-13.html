      <h1>日経平均が大幅反落、良品計画は好決算で上方修正、安川電機は減益で急落。次週の経済スケジュールに注目。</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>日経平均株価は3日ぶりに大幅反落し、67242.73円となった。 AI関連株の調整や中東不安が影響した。 良品計画は営業利益が前年同期比36.0％増の808億円と好調で、通期予想を890億円から980億円に上方修正した。 安川電機は営業利益が前年同期比19.2％減の84億円となり、減益着地が嫌気されて株価が急落した。 古野電気は営業利益が前年同期比65.3％増の56億円となり、好発進を見せた。</p>
