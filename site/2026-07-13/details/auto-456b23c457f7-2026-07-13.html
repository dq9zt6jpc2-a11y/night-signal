      <h1>ソフトバンク大関友久投手が体作りで球速・球威を向上し今季最速148キロを記録</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ソフトバンクの大関友久投手が2026年7月11日の試合で1カ月半ぶりに勝利を挙げ、今季最速148キロのストレートを記録した。 大関投手は体重を85キロから89キロに増やし、食事回数を1日5回に増やすなど体作りに注力し、球速と球威の向上に成功した。 今後の課題として決め球の精度向上が挙げられるが、球威の向上はチームにとって大きな前進と評価されている。</p>
