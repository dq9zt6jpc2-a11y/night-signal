      <h1>ゴールドマン・サックス：中国AI株への国際投資家の配分不足と今後の成長分野</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ゴールドマン・サックスは、中国AI株への国際投資家の資金配分が著しく不足していると指摘した。 特に電力、インフラ、具身知能などの分野で顕著である。 ゴールドマン・サックスは電力、半導体、AIインフラを網羅する「中国AIバリューチェーン」投資ポートフォリオを推奨し、物理AIやエッジAIなどの分野が今後データセンター建設に続く成長領域となり、AI投資サイクルを延長すると分析している。</p>
