      <h1>セブン＆アイ、ソフトバンクとPayPayが出資協議中で最大3000億円の出資を検討中であることが報じられる</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>セブン＆アイ・ホールディングスは、ソフトバンクとPayPayが同社に最大3000億円を出資する方向で協議していることを報じられた。 出資額はソフトバンクとPayPayがそれぞれ1000億円規模を検討しており、三井住友カードも出資する方向である。 出資はソフトバンクのAI技術を活用した次世代店舗の開発に繋がる見込みである。</p>
