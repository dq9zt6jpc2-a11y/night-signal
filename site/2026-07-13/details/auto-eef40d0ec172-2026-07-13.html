      <h1>日経225先物の夜間取引で140円高の6万7400円で寄り付く。日経平均株価も影響を受ける</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月13日、日経225先物の夜間取引は、日中取引の清算値に比べ140円高の6万7400円で寄り付いた。 この時点で、日経平均株価の現物終値は6万7242.73円で、157.27円高となっている。</p>
