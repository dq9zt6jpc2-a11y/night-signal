      <div class="article-summary">
        <p>新型プレリュードスポーツカーの発売とCR-Vのハイブリッドラインアップの拡充により、オーストラリア市場での成長が期待されている。 ホンダは2021年に固定価格販売モデルに移行し、年間18,000台の販売目標を設定している。 新型プレリュードは、2026年4月の受注開始以来、228台が販売され、顧客からの関心が高まっている。</p>
