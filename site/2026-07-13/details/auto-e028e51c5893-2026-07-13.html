      <h1>米ドル：労働市場安定とインフレ粘着でやや上昇予想、今週の経済指標とFRB議長証言が注目</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>米ドルは今後数ヶ月でほとんどの通貨に対してやや上昇すると予想されている。 米国の労働市場の安定と粘着性のあるインフレがFRBの利上げ観測を支える。 コアCPIは前月比0.2%、前年比2.9%で2ヶ月連続。 リテール売上高はワールドカップ関連消費で0.3%増、政策関連のコントロールグループ売上高は0.5%増と予想される。</p>
