      <h1>消費税引き下げで中小農家の手取りが3000億円減少の恐れ、政府は支援策を検討。</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>飲食料品の消費税を8％から1％に引き下げた場合、全国の中小農家の手取りが年間で約3000億円減少する可能性がある。 中小農家は高齢者が中心で、経営が厳しく離農が進む恐れがある。 政府は2027年4月に消費税率を1％に下げる案を検討しており、農家支援のための補助金支給も考慮されている。</p>
