      <h1>ジャニック・シナーがウィンブルドンでのタイトルを防衛、F1が祝福</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ジャニック・シナーがウィンブルドンでのタイトルを防衛し、アレクサンダー・ズベレフを相手に4セットで勝利を収めた。 フォーミュラ1は、シナーのウィンブルドン成功を祝福し、彼を「F1の友人」として称賛した。 シナーはモータースポーツの熱心なファンであり、過去2年間にアブダビグランプリに出席している。</p>
