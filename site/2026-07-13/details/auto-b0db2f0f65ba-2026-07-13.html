      <h2>概要</h2>
      <div class="article-summary">
        <p>ランド・ノリスが40回連続でQ3に進出したドライバーのクラブに加入した。 ノリスは2024年のアゼルバイジャングランプリ以来、予選セッションで早期に脱落しておらず、2024年シンガポールグランプリでポールポジションを獲得した。 2026年シーズンにおいてもノリスは安定したパフォーマンスを維持しており、モナコでは最低でも8位を記録している。</p>
