      <h1>日経平均株価が下げに転じ、一時700円安。韓国株安が影響</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月13日、東京証券取引所で日経平均株価が下げに転じ、一時700円安となり、6万7700円台で推移している。 韓国株式市場の総合株価指数（KOSPI）が一時3%超下落したことが、日本株に対する売り圧力を強めている。 中東情勢の緊迫を受けて、ニューヨーク原油先物が上昇し、これが日本株に影響を与えている。 日経平均株価の下落に伴い、ファーストリテイリングやアドテスト、キオクシアなどの株が安くなっている。</p>
