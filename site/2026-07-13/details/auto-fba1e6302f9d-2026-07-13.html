      <h1>三菱UFJ、時価総額で初の首位に 42兆円達成で株価上昇と業績期待感増大</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>三菱UFJフィナンシャル・グループが2026年7月13日の東京株式市場で、時価総額約42兆円となり、トヨタ自動車を抜いて日本企業として初めて首位に立った。 日銀の利上げにより、業績拡大への期待感が高まり、三菱UFJの株価は一時3564円まで上昇し、上場来高値を更新した。</p>
