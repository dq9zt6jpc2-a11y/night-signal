      <h1>ニイタカが増配を発表し、配当利回りが3.9%に上昇</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ニイタカ（4465）は、2027年5月期の配当を1株あたり84円とし、前期比7円の増配を発表した。 配当利回りは3.56%から3.93%に上昇した。 ニイタカは株主資本配当率（DOE）3%以上の配当を実施する方針に基づいて増配を決定した。</p>
