      <h1>Mercer International、Nasdaq非適合通知と2026年第2四半期決算発表予定</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>Mercer International Inc.（NASDAQ:MERC）は、株価が30営業日連続で1ドル未満となったため、Nasdaqから非適合通知を受けた。 同社は、10営業日連続で株価が1ドル以上となれば適合状態を回復できるが、猶予期間は180日間。</p>
