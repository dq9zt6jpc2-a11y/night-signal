      <h1>新NISAの買付額が71兆円を突破、半導体ファンドが人気急上昇</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>新NISAの買付額が71兆円を突破し、特に半導体関連ファンドへの投資が注目を集めている。 「eMAXIS 日経半導体株インデックス」は、東京証券取引所に上場する主要な半導体関連銘柄30社に投資するファンドで、キオクシアが36%を占める。 キオクシアの2026年6月の売買代金は75兆0242億円に達し、1日平均で約3兆4101億円の取引が行われている。</p>
