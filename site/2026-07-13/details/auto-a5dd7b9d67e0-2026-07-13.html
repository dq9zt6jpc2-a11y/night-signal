      <h1>セブン＆アイがソフトバンク・PayPayから約3,000億円の出資受け入れ協議、業界に波紋</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>セブン＆アイ・ホールディングスがソフトバンクやPayPayから約3,000億円程度の第三者割当増資による出資受け入れを協議中で、三井住友カードも出資を検討している。 ソフトバンク側が出資を提案したとされ、過去に孫正義会長がファミリーマートの共同経営を持ちかけた経緯もある。 出資受け入れはセブン＆アイの経営戦略に大きな影響を与える可能性があり、業界内外で注目と物議を醸している。</p>
