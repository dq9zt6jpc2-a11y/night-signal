      <h1>韓国SKハイニックス、米上場で4兆円調達と工場新設費5倍に増加へ</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>韓国SKハイニックスが米ナスダック市場に上場し、265億ドル（約4兆円）を調達した。 調達した資金は、人工知能（AI）向けの需要に備えた半導体工場の設備投資に使用される。 工場新設費は5倍に増加する見込みで、初値は170ドルとなり、公募価格の149ドルを14%上回った。</p>
