      <h1>セレクトセール2026で過去最高の売上を記録した日本の競走馬セリ市</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月13日に開催されたセレクトセール2026で、売上が過去最高の176億6000万円を記録した。 初日の262頭の1歳馬のうち、250頭が落札され、平均落札価格は7064万円となった。 最高額は4億2000万円で落札された牡馬「ヤングスターの2025」で、1億円超えの馬が過去最高の45頭に達した。</p>
