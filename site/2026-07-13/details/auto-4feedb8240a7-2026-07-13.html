      <h1>ホンダが2018-2020年モデルのオデッセイミニバン320,000台をリコール</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ホンダは、2018年から2020年モデルのオデッセイミニバン320,000台をリコールすることを発表した。 リコールの原因は、バックカメラの製造上の欠陥であり、カメラの取り付け部分に問題があった。 修理は8月下旬から開始され、修理にかかる部品と労働は無償で提供される。 修理には約3時間かかる見込みだが、ディーラーの混雑状況によってはさらに時間がかかる可能性がある。</p>
