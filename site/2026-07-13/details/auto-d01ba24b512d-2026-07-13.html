      <h1>ホンダインド、2028年までにサブ4メートルSUV市場参入と電動SUV発売計画を発表</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ホンダカーズインディアは2028年までにインド市場で競争が激しいサブ4メートルSUVセグメントに参入予定。 今年はインド初の自社開発バッテリー電気SUVを発売し、ディーゼルからガソリン、ハイブリッド、電気自動車への移行を加速させる。 競合他社が既に多様なコンパクトSUVを展開している中、ホンダの成功は製品戦略の実行力と価格競争力にかかっている。</p>
