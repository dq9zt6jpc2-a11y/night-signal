      <h1>中国で若者の就職難が深刻化、フレキシブルワーカー3億人超</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中国で就職難が深刻化しており、修士課程修了者でもデリバリー配達員として働く現実が報道された。 中国のフレキシブルワーカーは3億人を突破し、配車ドライバーや配達員の人余りが発生している。 若者の失業率が高く、履歴書を大量に送付しても就職できないケースが増えている。</p>
