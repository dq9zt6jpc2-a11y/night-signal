      <h1>NEC、AIを活用した販売戦略自動化サービスを発表</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>NECは、米国のアンソロピックとの協業により、AIを活用した販売戦略の自動化サービスを発表した。 このサービスは、消費者の購買データを基に商品企画や販促プランを自動で作成するもので、月額100万円で提供される。 NECは今後3年間で売上高100億円を目指しており、まずは飲料や加工食品などの企業と連携してビジネス検証を行う予定である。</p>
