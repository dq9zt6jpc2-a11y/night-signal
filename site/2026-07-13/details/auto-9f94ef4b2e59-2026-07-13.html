      <h1>AI投資による半導体インフレでスマホ・PCの消費が冷え込む懸念</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>人工知能（AI）投資の影響でメモリー半導体の価格が6倍に高騰し、これが電子機器の値上げラッシュを引き起こしている。 スマートフォンの価格は1年で平均94ドル（約1万5000円）上昇し、世界のスマホ・PCの出荷台数は年間で約2億台減少している。 この半導体価格の高騰は今後も続く見通しであり、AI投資によるインフレが消費を冷やす懸念が強まっている。 この現象は「チップフレーション」と呼ばれている。</p>
