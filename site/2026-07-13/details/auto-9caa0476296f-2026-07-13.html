      <h1>ゴルフ練習場でJPYC決済導入、国内初の試みがスタート</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>矢田産業株式会社と喜和産業株式会社は、ゴルフ練習場「鳥坂GC」において、日本円ステーブルコイン「JPYC」を用いたボール貸出システムを導入した。 このシステムでは、利用者がQRコードを読み取ることで250円分のJPYCを支払い、60球のボールを受け取ることができる。 この取り組みは国内初のステーブルコインを用いたゴルフボール貸出機の導入とされ、現金管理のコスト削減とキャッシュレス化のニーズに応えるものとされている。</p>
