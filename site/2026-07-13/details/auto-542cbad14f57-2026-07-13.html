      <h1>東京マーケット、円軟調で日経平均3日ぶり反落。中東情勢が影響</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ドル円は162.27円で、前営業日比0.59円の上昇を記録したが、韓国株の急落が影響し、日経平均は一時1900円超下落した。 中東情勢の緊迫化がリスク回避ムードを引き起こし、株価に影響を与えた。 債券先物相場は反落し、国内のインフレ懸念が高まる中で売りが優勢となった。</p>
