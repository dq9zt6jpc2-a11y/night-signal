      <h1>HashPortがKDDI・ローソンと提携し、ステーブルコイン決済の技術実証を実施</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>HashPortは、KDDIおよびローソンと連携し、2026年8月にローソン店舗で日本円ステーブルコインによる店頭決済の技術実証を実施する予定です。 この実証では、HashPortが提供するノンカストディアル型ウォレット「HashPort Wallet」を使用し、店舗側は「HashPort Wallet for Biz」を利用して決済処理を行います。 実施店舗はローソン高輪ゲートウェイシティ店で、実施期間は2026年8月です。</p>
