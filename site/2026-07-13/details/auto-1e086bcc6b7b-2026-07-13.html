      <h1>日本株の100万円超え銘柄が急増、個人投資家の取引スタイルに変化</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>この増加は、半導体およびAI関連株の急騰によるもので、個人投資家は1株単位での取引に注目している。 従来、日本株は100株単位で取引されていたが、株価の高騰により、個人投資家が投資額を下げるための新たな取引方法を模索している。</p>
