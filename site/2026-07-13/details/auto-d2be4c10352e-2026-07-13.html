      <h1>OpenAI、トランプ政権の要請で遅延していたGPT 5.6モデルを一般公開へ</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>公開遅延はサイバーセキュリティ上の懸念から政府が要請したもので、当初はパートナー企業のみへのプレビュー提供にとどめていた。 ホワイトハウスは政府がOpenAIに対して公開許可を与えたわけではなく、AIモデルの公開時期や範囲は企業の判断に委ねられていると声明を出している。 トランプ政権はAIモデルのリリースに関し自主的なテストプロセスを設けており、OpenAIはこれに協力しつつ公開を進めたとみられる。</p>
