      <h1>三菱重工業と大気社の目標株価が引き上げられる</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>岡三証券は、三菱重工業の目標株価を5500円から5800円に引き上げ、レーティングを「強気」とした。 野村証券は、大気社の目標株価を4040円から4850円に増額し、投資判断を「ニュートラル」とした。</p>
