      <h1>ホンダ欧州幹部が排出規制の一貫性と明確さを要望</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ホンダヨーロッパのハンス・デ・イェーガー社長は、欧州の排出規制に関し、規制当局に対して一貫性と明確さを求めている。 規制の変化が激しく、将来計画が非常に複雑になっていると指摘した。 同社は短期的な市場シェア獲得よりも長期的な持続可能性に注力しており、最近発売したコンパクトな電気自動車『スーパーネ』は顧客ニーズに基づいた製品であると説明した。</p>
