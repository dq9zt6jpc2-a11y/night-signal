      <h1>日本株市場の動向：半導体・AI株から小型株へのシフトが推奨される状況が続く</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>日本株市場では、半導体およびAI関連株を売却し、出遅れた小型株を購入する戦略が推奨されています。 企業業績は依然として強いものの、金利上昇や外国人投資家の売り越しが影響を及ぼしています。 特に、半導体関連の中小型株に注目が集まっており、アステラ・ラブスやクレド・テクノロジー・グループ・ホールディング、ペンギン・ソリューションズなどが挙げられています。</p>
