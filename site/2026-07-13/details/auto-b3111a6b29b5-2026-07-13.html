      <h1>ホンダ・シビックe:HEV RS、走行性能と快適性を両立した新ハイブリッドモデルとして6月発売予定</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>ホンダ・シビックe:HEV RSは新開発のタイヤを装着し、走行抵抗やロードノイズを低減しつつドライ路面での制動性能を向上させている。 e:HEV RSはシリーズ式ハイブリッドを基本としながらエンジン直結クラッチを備え、日常の延長線上でタイプRに通じる走る楽しさを提供するモデルとして開発された。 開発責任者の柿沼秀樹氏は、尖ったマニア向けではなく幅広いユーザーに楽しんでもらうことを目指していると述べている。</p>
