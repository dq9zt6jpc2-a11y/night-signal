      <h1>中国、7月第1週の乗用車小売台数が15％減、NEVも9％減</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中国の自動車業界団体によると、2026年7月第1週の乗用車小売台数は前年同期比15％減の3万3894台、NEV（新エネルギー車）は9％減の10.3万台となった。</p>
