      <h1>中国が氦ガスの輸出を臨時禁止し、サプライチェーン安全性が課題に</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>中国は2026年7月10日、氦ガスの臨時輸出禁止措置を即時実施した。 この措置は、米伊戦争による供給不足への自衛策とみられ、アジアの半導体生産国や米国にとってサプライチェーン安全性の重要性を浮き彫りにしている。 台湾や韓国、日本の半導体メーカーは短期的な影響は限定的だが、供給元の集中や在庫の耐性が今後の課題となる。 米中間の原材料供給や重要鉱物の調達を巡る摩擦が激化しており、米国は産業安全性を戦略的に重視する必要があるとの指摘がある。</p>
