      <h1>堂島金、132.9円高で取引終了 - 2026年7月13日市況報告</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月13日の堂島取引所において、堂島金は132.9円高の21,500.1円で取引を終了した。 堂島銀は312.26円で変わらず、堂島白金は104.3円高の8,604.9円で取引を終えた。 堂島金の取引高は3,153枚、堂島銀は1枚、堂島白金は4枚であった。</p>
