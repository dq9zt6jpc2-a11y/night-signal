      <h1>韓国が半導体分野に110兆円規模の投資計画を発表</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>韓国の李在明大統領は、半導体産業を国家戦略の最高位に押し上げると宣言し、1000兆ウォン（約110兆円）の投資計画を発表した。 この投資額は2025年の韓国の国内総生産の40％に相当し、半導体分野での大規模な賭けとなる。 李大統領は、現在のAI競争を国家の前途に関わる「全面競争」と形容した。</p>
