      <h1>インターアク、今期経常利益94%増と11円増配を発表</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>インターアクションは2026年7月13日に、今期の経常利益が前期比94%増の16.2億円に達する見通しを発表した。 同時に、年間配当を前期比11円増の55円に増配する方針を示した。 ただし、2026年5月期の連結経常利益は前の期比39.8%減の8.3億円に落ち込んだ。</p>
