      <h1>米Fedの政策金利推移：2025年利下げ、2026年は据え置き・利上げ観測強まる</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>委員の半数は年内の利上げを予想している。 新議長ケビン・ウォーシュは2026年5月に就任し、「インフレは選択」との哲学を示し、インフレの原因を金融政策に求める姿勢を強調。 イラン戦争による原油・ガス価格高騰がインフレ圧力を強め、年内の利上げ観測が高まっている。 2022～2023年にはインフレ抑制のため、Fedは大幅な利上げを実施。</p>
