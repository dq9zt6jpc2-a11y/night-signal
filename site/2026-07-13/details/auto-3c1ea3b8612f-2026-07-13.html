      <h1>S&amp;P500先物が1カ月ぶり高値を記録</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>2026年7月10日、S&amp;P500先物は7,620付近で1カ月ぶりの高値で取引を終了した。 セクター間のローテーションが進み、半導体銘柄の下落を他セクターの上昇が補った。 小型株は唯一弱含みだったが、主要4指数のうち3つが約0.3%上昇した。 来週は小売売上高、消費者インフレデータ、企業決算シーズン開始など重要なマクロイベントが控えている。</p>
