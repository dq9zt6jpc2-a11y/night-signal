      <h1>キオクシア株が最高値から52％下落、時価総額約30兆円が消失</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>キオクシアHD株は7月17日にストップ安の5万2,110円となり、6月22日の終値ベース最高値10万8,700円から52％下落した。 1カ月弱で時価総額は約30兆円減少し、信用買い残の積み上がりやBain Capitalの保有株売却が需給悪化への警戒材料となった。</p>
