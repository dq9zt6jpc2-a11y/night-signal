      <div class="article-summary">
        <p>米国の追加関税発表を受け、両政府は関税率、対象品目、発動時期を巡る協議を加速することで一致した。 交渉継続は撤回合意を意味せず、自動車、金属、農産品への適用と報復措置の有無が企業コストを左右する。</p>
