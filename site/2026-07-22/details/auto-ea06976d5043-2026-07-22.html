      <h1>SpaceX、Starship Flight 13の新たな試験日を設定</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>直前中止となったStarship Flight 13は不具合確認後に新しい試験日を設定し、再使用システムの検証を継続する。 VandenbergからのFalcon 9も月曜の中止後、火曜の再打ち上げを目指し、別系統のミッションにも遅延が波及した。 予定は確定結果ではないため、実際の離昇、軌道投入、機体回収を次号で結果に置き換える必要がある。</p>
