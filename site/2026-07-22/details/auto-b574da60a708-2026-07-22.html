        <p>SpaceXは上場後初となる2026年4～6月期の決算発表・説明会日程を示し、投資家向け開示を開始する。 延期されていたStarship Flight 13の新たな試験打ち上げ日も設定され、実施可否は天候と最終審査に左右される。</p>
