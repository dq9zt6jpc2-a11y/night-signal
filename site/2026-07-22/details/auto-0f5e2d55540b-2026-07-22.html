      <h1>売上高を数十倍に水増し、DBJから20億円詐取した疑いで再逮捕</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>容疑者は約20年にわたり決算を粉飾し、日本政策投資銀行の融資審査へ虚偽資料を提出した疑いが持たれている。 再逮捕は有罪確定ではなく、資金使途、監査・審査が見抜けなかった経緯、関係者の責任が今後の捜査対象となる。 警視庁は2022年以降の詐取額を計約47億円とみており、20億円は虚偽の設備投資計画と決算書で出資させた疑いの一部だ。</p>
