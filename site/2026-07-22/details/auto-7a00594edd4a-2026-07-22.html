      <h1>円安進行で国内銅価格が1トン237万円の過去最高</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>円が1ドル163円台へ下落したことで輸入建値が押し上げられ、国内銅価格は237万円へ上昇した。 円は4営業日続落して1989年以来初めて163円台へ下落し、LME銅価格の反発とともに国内建値を押し上げた。</p>
