      <h1>アントネッリがカナダGP初優勝、ハミルトン2位・フェルスタッペン3位</h1>

      <h2>30秒概要</h2>
      <div class="summary-lead">Formula 1公式結果によると、5月24日のカナダGP決勝はメルセデスのアンドレア・キミ・アントネッリが1時間28分15秒758で優勝し、25点を獲得した。2位はルイス・ハミルトンで10.768秒差、3位はマックス・フェルスタッペンで11.276秒差だった。公式日程ではカナダGPは5月22日から24日までの第5戦として掲載されている。</div>
