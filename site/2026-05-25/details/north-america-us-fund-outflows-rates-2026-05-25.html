      <h1>米株式ファンドから120.5億ドル流出、米30年債利回りは5.201%へ上昇</h1>

      <h2>30秒概要</h2>
        <div class="summary-lead">5月22日付のReuters配信によると、5月20日までの週に米株式ファンドから120.5億ドルが流出し、世界株式ファンドも9週ぶりの流出に転じた。同じ週に米30年国債利回りは5.201%へ上昇し、2007年以来の高水準となった。株式ファンドの流出と長期金利の上昇が同じ週に確認され、株式への資金配分と長期債利回りが同時に動いた週となった。</div>
