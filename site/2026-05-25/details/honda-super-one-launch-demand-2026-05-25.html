      <h1>Honda Super-ONEが発売、先行予約は約7000台と報道</h1>

      <h2>30秒概要</h2>
      <div class="summary-lead">Hondaは5月22日、小型EV「Super-ONE」の発売を発表した。5月24日掲載の報道は、車両価格が税込339万200円で、発売前の先行予約が約7000台に達したと伝えた。また、東京都で国と自治体の補助を組み合わせる場合、購入負担額は約149万円からになるとの説明を掲載している。公式ページでは車種情報と販売案内が確認できる。</div>
