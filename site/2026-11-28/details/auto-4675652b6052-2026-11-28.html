      <h1>米国第3四半期GDPが4.3%に上方修正、FRBの12月利上げ確率は99%に上昇</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>米国商務省は第3四半期のGDP年率換算成長率を3.4%から4.3%へ上方修正した 10月のPCE価格指数は前年同月比3.8%上昇、コアPCEは同3.3%上昇し、FRBの2%目標を著しく上回っている 力強い成長と粘着性の高いインフレが併存する中、市場の利上げ懸念が金融緩和への転換期待に取って代わり、12月の25ベーシスポイント（bp）利上げ確率は99%に上昇した</p>
