      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>SpaceXは木曜夜のFalcon 9打ち上げを理由を示さず中止し、米宇宙軍のUSSF-317を金曜夜へ延期した。 打ち上げはVandenberg宇宙軍基地SLC-4Eから午後6時32分開始の時間帯を予定し、搭載衛星数は非公表だ。 第1段B1100は11回目の飛行で、分離後はドローン船への着艦を目指す。</p>
