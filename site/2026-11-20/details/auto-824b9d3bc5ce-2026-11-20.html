      <h1>米物価3.7％、多くの業種で賃金の伸びが下回る</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>米消費者物価は2026年9月までの12カ月で3.7％上昇し、FOMC議事要旨は多くの業種で賃金上昇が物価上昇に遅れたと記した。 FOMC議事要旨では、データセンター建設など技能人材が不足する分野で賃金プレミアムが生じた一方、総賃金指標への影響は大きくないとされた。</p>
