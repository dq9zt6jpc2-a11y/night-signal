      <h1>日本株、週間でTOPIX6.8％安 AI資金調達懸念が重荷</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>AI関連企業では9月下旬以降、設備投資の規模拡大に伴う資金需要の増加などから、資金調達コストが大幅に上昇した。 データセンター建設が足踏みするとの警戒感が強まり、第3週の日本株は大幅安となった。 第3週のTOPIXは6.8％安で今年最大、日経平均は7.7％安で今年2番目の下落率となった。 市場関係者は、感謝祭前後の流動性低下や戻り売りを下押し要因とする一方、金利低下などで資金繰り懸念が和らげば反発余地もあるとみている。</p>
