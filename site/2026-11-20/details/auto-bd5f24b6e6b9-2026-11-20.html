      <h1>F1、2030年V8導入で基本合意 正式署名は未了</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>チーム代表は、現行PUを4季で終え、2030年にV8を基礎とする新方式を導入する基本合意に達したと説明した。 協議中の枠組みは持続可能燃料を使う2.1リッター・ターボV8で、ハイブリッド比率を縮小する。 2030年導入には十分なメーカー支持が必要となる。 CadillacはFerrariとの供給契約を1年延長し、自社PUの投入を2030年へ変更する方針で、V6とV8の複数設計を進めている。</p>
