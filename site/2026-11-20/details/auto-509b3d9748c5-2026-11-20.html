      <h1>日本の10月コア消費者物価、前年同月比2.2％上昇</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>総務省が11月20日に発表した10月の生鮮食品を除く総合指数は前年同月比2.2％上昇し、政府・日銀の物価安定目標である2％を2カ月連続で上回った。 AI投資拡大による半導体価格の高騰が携帯電話機などへ波及し、デジタル関連製品は前年同月比1割超上昇した。</p>
