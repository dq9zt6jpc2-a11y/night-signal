      <h1>YOASOBI「ハルカ」、累積再生4億回を突破</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>11月18日発表のオリコン週間ストリーミングランキングで「ハルカ」は週間73.3万回、累積4億66.7万回となり、YOASOBIで7作目の累積4億回突破となった。 「夜に駆ける」は累積12億回を突破し、「アイドル」はBillboard JAPAN Hot 100で21週連続首位を記録している。</p>
