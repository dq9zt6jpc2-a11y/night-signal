      <h1>Honda Avancier、豪州で2027年4月発売へ</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Honda Australiaは3列・6人乗りの新型Avancierを2027年4月から販売店へ投入し、現地仕様と価格の確定前から関心登録を受け付けている。 公開車は最上位RS仕様で、ローズゴールド塗装と20インチホイールを装備する。 15インチ画面、ヘッドアップディスプレイ、リラクゼーションシート、電動AWD付き次世代Honda Hybridを搭載予定で、タイのCR-Vと同じ工場で生産する。</p>
