      <h1>Cadillac、自社F1パワーユニット投入を2030年へ延期</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>General MotorsはCadillac向け自社PUの投入を当初の2029年から2030年へ1年延期し、それまでFerrariの顧客チームを続ける。 背景は2030年V8導入の基本合意で、正式署名は未了だが、2.1リッター・ターボV8と電動比率縮小の方向が示されている。 新施設の稼働当初はV6とV8の両設計を進め、2030年の初自社PU投入を目指す。</p>
