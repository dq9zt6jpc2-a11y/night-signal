      <h1>ドル円、一時158.81円 米10年債利回り5％割れ</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>ロンドン市場でドル円は一時158.81円まで下落し、米10年債利回りは5％を割って4.98％台へ低下した。 ユーロドルは1.0970台、ポンドドルは1.3110台へ上昇し、記事時点ではドル円158.83、ユーロ円174.37、ポンド円208.27だった。</p>
