      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>香港メディアは、DeepSeekが処理能力不足を理由に未使用会話や入力文字数を制限し、中国AI業界が半導体規制と収益難に直面していると報じた。 同記事は、中国製半導体への移行で時間・費用が5割以上増えるとの見積もりや、海外データセンター経由の利用にも米国許可が必要になったと説明する。 有料利用者は約1割、中国大手6社のAI年間売上合計は米大手2社の約10分の1だと同記事は推計している。</p>
