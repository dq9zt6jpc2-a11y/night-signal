      <h1>非公式韓国試験、GPT-6.2 AstraとGemini 4 Neonが満点</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>個人開発者が公開した2027学年度韓国大学修学能力試験の非公式評価で、GPT-6.2 AstraとGemini 4 Neonは450点満点、GPT-6.2 Solは449.6点だった。 Claude Opus 5.5とFable 5.2は449.3点、韓国勢最高のK-Exaone 2.5は414.7点だった。 評価は外部ツールを使わずAPIのみで実施され、公式サービス上の利用環境とは結果が異なる可能性がある。</p>
