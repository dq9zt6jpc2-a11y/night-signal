      <h1>フィリピン、SpaceX商業打ち上げ拠点を初期協議</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Marcos大統領は、SpaceXとフィリピン国内の商業打ち上げ拠点を巡る協議が初期段階にあると説明した。 国家宇宙計画ではなく、打ち上げ事業の誘致が目的だ。 政府は西太平洋に面する立地を適地とみるが、投資契約や具体的な拠点は決まっていない。 大統領は、Musk氏が検討しているとされる島について詳細を把握しておらず、それが打ち上げ候補地かも不明だと述べた。</p>
