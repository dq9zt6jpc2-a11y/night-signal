      <h1>国内旅行消費、7～9月は過去最高の8兆4354億円</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>2026年7～9月の日本人国内旅行消費額は前年同期比4.3％増の8兆4354億円で過去最高となった。 延べ旅行者数は0.5％減の1億6046万人だった。 月別旅行者数は7月4350万人で0.5％増、8月6299万人で5.1％減、9月5397万人で4.4％増。 1人1回当たり単価は4.9％増の5万2569円で、宿泊旅行は7万6981円、日帰りは1万9881円だった。</p>
