      <h1>Honda出身の井上勝史氏、アステモ次期社長へ</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>井上勝史氏の社長就任は6月25日の株主総会と7月1日の臨時取締役会を経て正式決定する。 井上氏はHondaの欧州・中国責任者、電動事業開発部門トップ、四輪事業本部長などを歴任した。 Hondaは日立保有のアステモ株21％を取得して出資比率を61％へ高め、子会社化する予定だ。</p>
