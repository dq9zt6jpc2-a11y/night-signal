      <h1>米GDPNow、4～6月期成長率を年率1.7％と推計</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>原油価格が落ち着く前提では、7～9月期の個人消費はガソリン価格の鎮静化による実質賃金改善で底堅く推移すると見込まれる。 3カ月移動平均では11.1万人と前月から減速したものの、均してみれば2026年初から雇用の持ち直しが続いている。 Atlanta FedのGDPNowは7月17日時点で、4～6月期の実質GDP成長率を前期比年率1.7％と推計した。</p>
