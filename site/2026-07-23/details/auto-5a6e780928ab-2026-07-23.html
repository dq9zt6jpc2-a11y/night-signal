      <h1>SoftBank、生成AI向け記事基盤「Garan AI」を試験開始</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>SoftBankは7月22日、生成AI向け情報基盤「Garan AI」の試験運用を始めた。 毎日新聞、産経新聞、共同通信など30超の報道機関が記事提供を表明している。 2027年1月までの本格商用化を目指し、将来は行政機関などへのデータ提供拡大も計画する。</p>
