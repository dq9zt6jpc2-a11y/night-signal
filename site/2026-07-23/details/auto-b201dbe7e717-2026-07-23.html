      <h1>宇都宮市のMICE、2025年度は250件で過去最多</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>宇都宮市で2025年度に開催された国際会議、学会、展示会などのMICEは250件となり、2022年度の調査開始以降で最多を記録した。 開催に伴う宿泊や飲食などの消費額も24億7千万円と過去最高を更新した。 本年度目標の開催220件、消費額22億円を前倒しで達成した。</p>
