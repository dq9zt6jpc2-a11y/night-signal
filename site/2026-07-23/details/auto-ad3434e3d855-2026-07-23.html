      <h1>カナダ、第6世代戦闘機の国際共同計画へ参加</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>カナダは7月21日のFarnborough International Airshowで第6世代戦闘機の国際共同計画への参加を発表した。 専門家は、米国がF-47を同盟国へ輸出する可能性がさらに低下したとの見方を示した。 参加国は単独で安全保障課題へ対応するのは難しく、同盟国間の防衛・産業協力を深める意義を強調した。 一方、米政権は2025年のF-47発表時に将来の同盟国供給へ言及していた。</p>
