      <h1>NVIDIA、次世代AI基盤Vera Rubinの量産を開始</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>NVIDIAは次世代AIプラットフォーム「Vera Rubin」の全面量産開始を発表した。 GPUを72基搭載するラックの販売価格は700万～800万ドルとされ、前世代Grace Blackwellの約300万ドルから大幅に上昇した。 エージェント型AIによるCPU需要への期待から、AMDとIntelの年初来上昇率は128％、149％となり、NVIDIAの約8％を上回った。</p>
