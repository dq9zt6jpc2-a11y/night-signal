      <h1>OpenAI、事前学習指標を公開し業界共通の安全上限を提案</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>11月22日、OpenAI最高科学責任者のヤクブ・パホツキ氏が事前学習の進展と安全性に関する文章を発表した。 OpenAIはGPT-3.5から未公開の社内モデルまで、事前学習指標の推移を示した。 公開図では未公開の社内モデルが約0.73に達したとされた。 パホツキ氏は、安全条件を満たすまでは共通上限を越えないと開発企業が約束する枠組みを提案した。 パホツキ氏は、早ければ2027年にも事前学習の基礎研究が相次いで進展する可能性があると述べた。</p>
