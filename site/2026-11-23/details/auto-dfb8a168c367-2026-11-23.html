      <h1>訪日消費、2026年7～9月期に2兆2,076億円で同期間の最高更新</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>2026年4～6月期は訪日客数が前年同期比5.3%減る一方、消費額は0.3%増えて第2四半期として過去最高だった。 7～9月期は訪日客数が964万人で前年同期比4.8%減り、消費額は2兆2,076億円で3.2%増えて同期間の過去最高を更新した。 1人当たり旅行支出は23.4万円で前年同期比6.1%増え、客数減を補った。</p>
