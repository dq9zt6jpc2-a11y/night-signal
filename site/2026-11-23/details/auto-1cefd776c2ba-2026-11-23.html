      <h1>FIAとF1各陣営、2030年の2.1リッターV8ターボ枠組みに全会一致</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>FIA、Formula One Management、F1チーム、エンジンメーカーは、2030年から2.1リッターV8ターボを導入する枠組みに全会一致した。 最終枠組みは12月10日に上海で開かれる世界モータースポーツ評議会へ提出される予定だ。 Cadillacは2029年までFerrari製エンジンを使い、提案された規則に合わせて2030年に自社製パワーユニットを導入する計画だ。</p>
