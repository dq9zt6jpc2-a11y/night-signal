      <h1>SpaceX、同一発射台の打ち上げ間隔を32時間に短縮</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>SpaceXは2026年11月22日、米カリフォルニア州ヴァンデンバーグ宇宙軍基地からFalcon 9を打ち上げた。 NROL-136は同じ第4E発射施設からの前回打ち上げの32時間後に出発し、機密衛星を低軌道へ運んだ。 Elon Musk氏は11月18日、発射塔で初めて捕捉したStarship上段Ship 42を歴史的機体として保存し、再飛行させない考えを示した。</p>
