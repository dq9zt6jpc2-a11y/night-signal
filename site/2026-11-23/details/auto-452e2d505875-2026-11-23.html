      <h1>ボツワナ、Starlinkの衛星直結携帯サービスを2027年初頭に全国展開へ</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>コンゴ民主共和国では2026年8月、Airtelが試験などを経てアフリカ初の商用衛星直結携帯サービスを開始した。 ボツワナはStarlinkの衛星直結携帯サービスを導入するアフリカ2番目の国と、全国展開する最初の国を目指している。 AXIAN Telecomは2026年3月初め、AST SpaceMobileと標準的な携帯電話へ4G・5Gの音声とデータを直接届ける提携を結んだ。</p>
