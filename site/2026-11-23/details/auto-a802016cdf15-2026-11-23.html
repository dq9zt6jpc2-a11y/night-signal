      <h1>F1カタールGP、タイヤ1セットの使用を最大27周に制限</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>PirelliはカタールGPで、1セットのタイヤを連続使用できる上限を前年の25周から27周に設定した。 制限はルサイルの中高速コーナーが前輪へ大きな負荷をかけることを踏まえた安全措置だ。 57周の決勝では各車最低2回のピットストップが必要で、セーフティカー中の周回も27周に算入される。</p>
