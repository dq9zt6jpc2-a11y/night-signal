      <h1>SpaceX株、上場後初めてIPO価格を下回る</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>SpaceX株は7月15日に一時132.28ドルまで下落し、IPO価格135ドルを上場後初めて割り込んだ。 上場後高値から時価総額は約1兆7,800億ドルまで縮小し、NASDAQ100採用後も株価は約13％下落した。</p>
