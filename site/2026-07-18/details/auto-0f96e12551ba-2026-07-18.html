      <h1>F1ベルギーGP FP2、アントネッリが首位</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>7月18日のFP2でメルセデスのアンドレア・キミ・アントネッリが1分45秒944で首位、ランド・ノリスが0.190秒差、マックス・フェルスタッペンが0.472秒差で続いた。 アストンマーティン・ホンダはランス・ストロールが21位、フェルナンド・アロンソが22位だった。</p>
