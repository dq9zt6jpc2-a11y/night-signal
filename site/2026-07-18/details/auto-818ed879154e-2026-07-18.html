      <h1>深圳の半導体産業売上高、2025年に27.1％増</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>深圳市の2025年半導体産業売上高は前年比27.1％増の3,610億4,000万元となった。 IC設計は26.5％増の2,421億3,000万元、ウエハー製造は40.5％増の79億5,000万元だった。</p>
