      <h1>家計の1年後インフレ期待、過去最高を更新</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>日銀の6月調査で、1年後に物価が上がると答えた割合は90.4％、5年後は86.1％となった。 1年後は2008年6月の従来最高88.9％を上回った。 予想する年平均上昇率は1年後13.1％、5年後10.8％でともに過去最高だった一方、現在の景況感DIはマイナス56.7、1年後見通しはマイナス42.5に悪化した。</p>
