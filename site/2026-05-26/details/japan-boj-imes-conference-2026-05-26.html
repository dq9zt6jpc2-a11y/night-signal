      <h1>日銀IMES会議は5月27日開幕、植田総裁が冒頭挨拶の予定</h1>

      <h2>30秒概要</h2>
      <div class="article-summary">
        <p>日本銀行金融研究所の公式プログラムによると、2026 BOJ-IMES Conferenceは5月27日と28日に「Monetary Policy from New Perspectives」をテーマとして開催される。初日9時の冒頭挨拶は植田和男総裁が担当し、同日には世界的な価格ショックと国際的な金融政策協調、金融政策と不均衡を扱う討議が並ぶ。翌日には氷見野副総裁が司会を務め、FedとECBの関係者を迎える対話も予定されている。</p>
      </div>
