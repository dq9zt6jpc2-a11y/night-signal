      <h1>GRT、中国Zhenguan New Materialと最大3億元のフィルム供給基本契約</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>GRTは、出資取得を進めるZhenguan New Materialと最大3億元規模の機能性フィルム供給基本契約を結んだ。 3億元は供給上限で、実際の売上高は個別発注によって確定する。 契約は2027年6月30日までで、MLCC用離型フィルム、PET、TPUなどを供給し、2027年には揚州と欽天の新工場稼働を予定する。</p>
