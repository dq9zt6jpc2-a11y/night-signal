      <h1>東京国税局、暗号資産の追徴税額約12億円 調査体制を強化へ</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>東京国税局の管轄は東京都、千葉県、神奈川県、山梨県の1都3県だ。 暗号資産を巡る追徴税額は約12億円で、無申告が判明する事例が多かったという。 国税当局は調査体制を強化し、申告漏れの把握を進める方針だ。</p>
