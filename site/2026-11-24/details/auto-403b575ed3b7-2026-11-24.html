      <h1>米住宅、売り出し1件当たり高意向買い手が3.5人で過去最低</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Zillowによると、2026年第3四半期の全米の売り出し物件1件当たり高意向買い手は平均3.5人で、前年同期比4.8%減り、2023年下半期の集計開始以来最低となった。 Freddie Macの調査では、30年固定住宅ローン金利が2026年7月2日の週の6.43%から10月1日に7.28%へ上昇した。 Zillowは、住宅ローン金利上昇で比較検討する買い手が減る一方、在庫が積み上がり需要が分散したと指摘した。</p>
