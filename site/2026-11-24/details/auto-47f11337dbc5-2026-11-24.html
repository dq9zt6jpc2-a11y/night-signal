      <h1>OpenAIとCisco、未修正Linuxを稼働中に守るOSS「Shirudo」を公開</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Shirudoは、恒久パッチの準備中にeBPFでエクスプロイト経路を遮断するオープンソースのランタイムだ。 両社は、恒久的な修正プログラムの作成・試験中もセキュリティチームがLinuxマシンを保護できるようにする目的で公開した。 プロジェクトは2026年11月23日に発表され、コードはBSD 2条項、BPFプログラムはBSDとGPLのデュアルライセンスで提供される。</p>
