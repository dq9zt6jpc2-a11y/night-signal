      <h1>SpaceX株がIPO価格へ接近、社債スプレッドも231bpへ拡大</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>株価は7月10日に4.51％、13日に4.24％下落して139.14ドルとなり、6月12日の上場初値150ドルを約7％下回りました。 2056年償還債の信用スプレッドは発行時の175bpから231bpへ広がり、債券価格下落の3分の2超を説明するとされています。</p>
