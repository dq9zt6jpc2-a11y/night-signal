      <h1>OpenAI、プロンプトインジェクション攻撃用AI「GPT-Red」を発表</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>GPT-5.1を対象にした比較では84％のシナリオで攻撃に成功し、人間のレッドチームの13％を上回りました。 対戦結果を訓練に反映したGPT-5.6では、難関ベンチマークの失敗が4カ月前のモデルの6分の1に減ったとしています。 悪用防止のためGPT-Redは社内限定で、外部提供しない方針です。</p>
