      <h1>4月鉱工業生産は前月比0.8%増、5月は5.1%増を見込む</h1>

      <h2>記事まとめ</h2>
      <div class="article-summary">
        <p>報道によると、日本の4月の鉱工業生産（工場出荷）は前月比0.8%増となり、前月の下振れから反転した。市場予想では前月比マイナスが見込まれていた。</p>
        <p>記事は、増加の背景として半導体製造装置や機械の伸びを挙げ、AI関連投資の需要が下支えした可能性に触れている。</p>
        <p>また、経産省の製造工業生産予測調査として、5月は前月比5.1%増、6月は0.4%減の見通しが示され、短期的な変動が続く可能性を示唆している。</p>
