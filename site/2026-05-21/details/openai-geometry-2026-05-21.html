      <h2>30秒概要</h2>
      <div class="summary-lead">OpenAIは5月20日、内部モデルがErdősの単位距離問題に関する長年の予想を反証したと発表した。外部数学者が検証した証明は、平面上のn点に含まれる単位距離ペア数について、従来有力だった正方格子型構成の限界を上回る無限族を示す。製品機能ではなく研究成果だが、汎用推論モデルが専門数学の未解決問題に到達した事例として、AI研究力、安全性評価、人材・計算資源投資を読むうえで重要な材料になる。</div>
