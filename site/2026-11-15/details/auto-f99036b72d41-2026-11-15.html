      <h1>日経平均、急落後に6万1,142円へ回復</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>日経平均は2026年11月6日に前日比3,643円安の5万7,434円で取引を終え、約半年ぶりに6万円を下回った。 米国の半導体株指数は1日で12%下落した。 記事が参照したAP集計は米下院選の獲得議席を民主党256、共和党169と報じ、残る10議席を別に示した。</p>
