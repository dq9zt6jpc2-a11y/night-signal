      <h1>OpenAI、米国の対中AI半導体輸出規制強化法案を支持</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>OpenAIは数カ月の社内検討を経て、中国向け先端AI半導体、間接輸出、ASMLの先端装置へのアクセスをさらに制限する超党派法案への支持を表明した。 議員は法案を年次国防権限法に組み込み年内成立を目指す一方、Nvidiaと業界団体は米半導体産業への悪影響を主張している。 既存規制でNvidiaは中国向けH20を改変しており、政権が貿易休戦への影響を懸念して拒否権を示せば法案が頓挫する可能性もある。</p>
