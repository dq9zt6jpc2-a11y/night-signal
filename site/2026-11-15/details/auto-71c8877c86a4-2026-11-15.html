      <h1>Fed、2027年決済サービス料金を平均1.4%引き上げへ</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>米連邦準備制度は銀行・信用組合向け決済サービスの2027年料金を発表した。 2027年は実費とみなし費用の101.5%を回収する見込みである。 既存の成熟したサービスは平均1.4%の値上げとなる。 2027年のFOMC会合日程も発表され、年間8回開催する。 会合は金融政策の討議に充てられ、投票は予定されていない。</p>
