      <h1>公式日程を基準にし、試合後は結果で必ず上書きする</h1>
      <p>ブレックスは予定（スケジュール）と結果（試合結果ページ）の更新タイミングが異なることがある。予定を拾ったままにせず、試合が終わったら公式の結果・試合詳細で上書きして当日版を確定させる。</p>

      <h2>一次リンク</h2>
      <ul>
        <li><a href="https://www.utsunomiyabrex.com/schedule/">クラブ公式スケジュール</a></li>
        <li><a href="https://www.bleague.jp/club_detail/?TeamID=703">B.LEAGUE 公式（クラブページ）</a></li>
      </ul>

      <h2>運用ルール</h2>
      <ul>
        <li>予定情報はカード本文に「予定」と明記する。</li>
        <li>試合日を過ぎたら、結果ページ（公式・試合詳細）で上書きする。</li>
        <li>速報サイト（Flashscore等）は補助。採用は公式で固定してから。</li>
      </ul>
