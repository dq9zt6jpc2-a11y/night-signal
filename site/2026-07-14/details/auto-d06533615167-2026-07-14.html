      <h1>TaviaとVita、4億5000万ドルのNASDAQ上場に向けた基本合意書を締結</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>Tavia Acquisition Corp.とVita Inclinata Technologies, Inc.は、VitaをSPACを通じて上場させるための非拘束的な基本合意書（LOI）を締結しました。 この取引は、Vitaの事前評価額を4億5000万ドルとし、2026年第4四半期に完了する予定です。 取引の完了は、Vitaが戦略的買収を完了し、最終契約を締結することを条件としています。</p>
