      <h1>YOASOBI、「オリオン」英語版MVをYouTubeでプレミア公開</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>YOASOBIがゲーム『オーバーウォッチ』とのコラボ楽曲「オリオン」の英語版MVを2026年7月10日23時にYouTubeでプレミア公開することを発表した。 この楽曲は、2026年6月26日にリリースされた4th EP『THE BOOK for,』に収録されている。</p>
