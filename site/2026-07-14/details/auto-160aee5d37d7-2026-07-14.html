      <h1>日経平均株価が500円上昇、エーザイと銚子丸が注目を集める</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>日経平均株価は500円上昇し、67,743円で取引を終了しました。 米国のCPI発表や主要銀行の決算が市場の注目を集めています。 エーザイはアルツハイマー病治療薬の新しい投与方法の承認を受け、株価が3.1%上昇しました。 銚子丸は第1四半期の業績が好調で、年初来高値を更新しました。</p>
