      <h1>アストンマーティン、ベルギーGPでジャック・クロフォードをFP1に起用</h1>

      <h2>概要</h2>
      <div class="article-summary">
        <p>アストンマーティンは、ベルギーGPのFP1セッションでフェルナンド・アロンソの代わりにジャック・クロフォードを起用することを発表しました。 クロフォードは2026年シーズンのアストンマーティンのサードドライバーであり、これが今シーズン3回目のFP1出場となります。 F1の規則に基づき、チームは最低12ラウンドでルーキードライバーを起用する必要があります。</p>
