      <h1>インドFY26実質GDP、7.7%成長でQ4は7.8%</h1>

      <h2>30秒概要</h2>
      <div class="article-summary">インドのFY26実質GDPは7.7%成長となり、FY25の7.1%から加速した。1〜3月期にあたるQ4FY26は7.8%成長で、製造業、商業・ホテル・運輸・通信、放送関連サービス、不動産などが強かった。一方で、RBIは6月5日の金融政策でFY27の実質GDP成長率見通しを6.6%に下げた。インドは高成長を維持しているが、エネルギー高、供給制約、地政学リスクが次年度見通しを抑える構図になっている。</div>
