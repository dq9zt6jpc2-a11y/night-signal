      <h1>幾田りら『Laugh』ツアー後半、韓国公演後の発信と公式ページが更新局面に</h1>
      <h2>30秒概要</h2>
      <div class="summary-lead">幾田りらの2nd Album『Laugh』関連では、国内公演から韓国公演までのツアー情報が公式ページにまとまり、終了後の写真・映像・追加発信がSNSとYouTubeに分かれて出る段階に入った。YOASOBI本体の発表と幾田りらソロの発表は対象が異なるため、公式HP、スタッフX、YouTubeを分けると、楽曲リリース、ライブ余韻、次のタイアップ情報を混同せずに読める。</div>
