      <h1>Honda、4月世界生産276,895台で北米増と中国減の差が鮮明に</h1>
      <h2>記事まとめ</h2>
      <div class="article-summary">Hondaの4月四輪生産販売データでは、世界生産が276,895台、前年比99.2%となり、地域差が前面に出た。国内生産は58,762台で前年比122.9%、北米生産も153,614台で105.9%と伸びた一方、中国生産は28,842台で61.1%に落ち込んだ。ハイブリッドと北米の強さで全体を支える一方、中国の販売・生産調整が収益回復の重しになっている。</div>
