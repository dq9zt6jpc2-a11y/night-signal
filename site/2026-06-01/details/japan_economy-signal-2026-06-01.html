      <h1>日本の4月鉱工業生産、前月比0.8%増で製造業予測は5月増を示す</h1>
      <h2>記事まとめ</h2>
      <div class="article-summary">経済産業省の鉱工業指数では、4月の生産が前月比0.8%増となり、前月の弱さから反転した。製造工業生産予測調査では、5月は5.1%増、6月は0.4%減が見込まれ、単月の持ち直しが継続的な回復に変わるかはまだ分かれ道にある。雇用・小売・日銀統計と合わせると、物価高の下で需要がどこまで生産を支えられるかが次の論点になる。設備投資や輸出向け機械の動きが弱まると、製造業予測の上振れも短期で崩れやすい。</div>
