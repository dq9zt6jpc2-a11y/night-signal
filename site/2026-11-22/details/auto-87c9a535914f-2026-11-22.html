      <h1>Honda、新型SUV「AVANCIER」を世界初公開</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Hondaは11月20日、次世代ハイブリッドシステムを採用する新型SUV「AVANCIER」を世界初公開した。 AVANCIERは新Hマークをハイブリッド車として初採用し、新プラットフォームと「Honda Hybrid」を初搭載する。 HondaはAVANCIERを皮切りに、「Honda Hybrid」搭載車を2029年度までに世界で15車種投入する計画だ。</p>
