      <div class="article-summary">
        <p>Hondaの開発・テストライダーを務めたステファン・ブラドルは、MotoGPライダーの現場支援とHRC指導体制の強化を担う新職へ移る。 2027年のHondaファクトリー体制にはファビオ・クアルタラロとディオゴ・モレイラが加わる。 ブラドルは開発ライダーからHondaのスポーティング体制を担う役割へ移行する。</p>
