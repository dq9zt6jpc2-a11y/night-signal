      <h1>フィリピン政府、SpaceXの商業ロケット打ち上げ誘致に意欲</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>フィリピン大統領は、西太平洋上の立地がロケット打ち上げに適するとし、SpaceXが同国での事業拡大を検討することに期待を示した。 一方、大統領は2島の開発報道について詳細を把握しておらず、具体的な取り決めはないと述べた。 駐米フィリピン大使は、マスク氏が1～2島への投資・開発を検討しているとの情報に言及した。</p>
