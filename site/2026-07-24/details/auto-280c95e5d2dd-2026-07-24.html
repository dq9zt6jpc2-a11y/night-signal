      <h1>Honda、広汽集団との中国合弁を2038年まで延長</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>Hondaは、2028年に期限を迎える広州汽車集団（GAC）との中国合弁契約を10年間延長し、2038年まで継続する。 Hondaの中国販売は2020年の162万台から2025年には64万台へ減少しており、販売不振下でも中国事業を維持する判断となった。 同合弁は1999年以来1100万台超を生産・販売してきたが、2026年のGAC Honda新型車投入計画はなく、電動化が急速に進む市場で立て直しが課題となる。</p>
