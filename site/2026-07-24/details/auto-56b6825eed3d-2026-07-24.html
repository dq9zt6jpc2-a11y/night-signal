      <h1>6月の消費者物価1.6％上昇、5カ月連続で2％未満</h1>

      <h2>確認できた事実</h2>
      <div class="article-summary">
        <p>6月の消費者物価上昇率は日銀の物価安定目標である2％を5カ月連続で下回った。 コメ類は前年同月比8.7％下落し、ピーク時には前年の約2倍まで上昇していた価格が低下した。 ガソリン価格は0.7％下落し、5月の7.0％下落から下落幅が大きく縮小した。</p>
