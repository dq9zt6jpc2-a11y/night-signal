name: Publish reviewed NIGHT SIGNAL
run-name: "${{ (inputs.validation_only || startsWith(github.ref_name, 'night-signal-preflight-')) && 'Preflight NIGHT SIGNAL' || 'Publish reviewed NIGHT SIGNAL' }} ${{ inputs.issue_date || github.ref_name }}"

on:
  push:
    branches:
      - "night-signal-review-*"
      - "night-signal-preflight-*"
    paths:
      - "cloud-review/**/editor_review.json"
      - "cloud-preflight/**/editor_draft.json"
      - "cloud-review/**/editor_correction.json"
  workflow_dispatch:
    inputs:
      issue_date:
        description: "JST issue date to recover."
        required: true
        type: string
      review_ref:
        description: "Review branch named night-signal-review-YYYY-MM-DD."
        required: true
        type: string
      validation_only:
        description: "Run the editorial and release checks without publishing."
        type: boolean
        default: false
      recovery_attempt:
        description: "Bounded deterministic base-race recovery attempt."
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: night-signal-reviewed-publication-${{ inputs.issue_date || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      VALIDATION_ONLY: ${{ inputs.validation_only || startsWith(github.ref_name, 'night-signal-preflight-') }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and fetch the isolated review handoff
        id: resolve
        env:
          REQUESTED_ISSUE_DATE: ${{ inputs.issue_date || '' }}
          REQUESTED_REVIEW_REF: ${{ inputs.review_ref || '' }}
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt || '0' }}
        run: |
          DRAFT_REF=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == night-signal-preflight-* ]]; then
            DRAFT_REF="$GITHUB_REF_NAME"
            ISSUE_DATE="${DRAFT_REF#night-signal-preflight-}"
            REVIEW_REF="night-signal-review-$ISSUE_DATE"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            REVIEW_REF="$GITHUB_REF_NAME"
            ISSUE_DATE="${REVIEW_REF#night-signal-review-}"
          else
            REVIEW_REF="$REQUESTED_REVIEW_REF"
            ISSUE_DATE="$REQUESTED_ISSUE_DATE"
          fi
          if [[ ! "$ISSUE_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid issue date: $ISSUE_DATE" >&2
            exit 1
          fi
          if [[ "$REVIEW_REF" != "night-signal-review-$ISSUE_DATE" ]]; then
            echo "Review ref is not bound to issue date: $REVIEW_REF" >&2
            exit 1
          fi
          if [[ -n "$DRAFT_REF" ]]; then
            git fetch --no-tags origin "$GITHUB_SHA"
            git show "$GITHUB_SHA:cloud-preflight/$ISSUE_DATE/editor_draft.json" \
              > "$RUNNER_TEMP/editor_review.json"
            echo "DRAFT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "CORRECTION_PATH=" >> "$GITHUB_ENV"
          else
          git fetch --no-tags origin \
            "refs/heads/$REVIEW_REF:refs/remotes/origin/$REVIEW_REF"
          git show \
            "refs/remotes/origin/$REVIEW_REF:cloud-review/$ISSUE_DATE/editor_review.json" \
            > "$RUNNER_TEMP/editor_review.json"
          CORRECTION_SPEC="refs/remotes/origin/$REVIEW_REF:cloud-review/$ISSUE_DATE/editor_correction.json"
          if git cat-file -e "$CORRECTION_SPEC" 2>/dev/null; then
            git show "$CORRECTION_SPEC" > "$RUNNER_TEMP/editor_correction.json"
            echo "CORRECTION_PATH=$RUNNER_TEMP/editor_correction.json" >> "$GITHUB_ENV"
          else
            echo "CORRECTION_PATH=" >> "$GITHUB_ENV"
          fi
          fi
          echo "ISSUE_DATE=$ISSUE_DATE" >> "$GITHUB_ENV"
          echo "REVIEW_REF=$REVIEW_REF" >> "$GITHUB_ENV"
          echo "RECOVERY_ATTEMPT=$RECOVERY_ATTEMPT" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Stop when this exact issue is already verified live
        id: already_public
        run: |
          if [[ "$VALIDATION_ONLY" == "true" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$CORRECTION_PATH" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Correction overlay requires a same-day rebuild."
            exit 0
          fi
          if python3 scripts/publication_audit.py "$ISSUE_DATE"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "The committed issue and both public URLs are already verified."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore final Evidence without collection or model work
        id: restore
        if: ${{ steps.already_public.outputs.published != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/night_signal_review_artifact.py \
            "$ISSUE_DATE" --restore-only

      - name: Validate cloud provenance and apply every reviewed event
        id: apply
        if: ${{ steps.already_public.outputs.published != 'true' }}
        run: |
          set -o pipefail
          CORRECTION_ARGS=()
          if [[ -n "$CORRECTION_PATH" ]]; then
            CORRECTION_ARGS+=(--correction-path "$CORRECTION_PATH")
          fi
          {
            python3 scripts/night_signal_cloud_review.py "$ISSUE_DATE" \
              --review-ref "$REVIEW_REF" \
              --review-path "$RUNNER_TEMP/editor_review.json" \
              "${CORRECTION_ARGS[@]}"
            python3 scripts/night_signal_plus_editor.py "$ISSUE_DATE" \
              --apply-review "state/$ISSUE_DATE/editor_review.json"
          } 2>&1 | tee "$RUNNER_TEMP/apply.log"

      - name: Render and run deterministic publication gates
        id: gates
        if: ${{ steps.already_public.outputs.published != 'true' }}
        run: |
          set -o pipefail
          {
            python3 scripts/night_signal_publish.py "$ISSUE_DATE" \
              --deploy-existing \
              --deploy-edited-final-evidence \
              --verification-profile deploy
            python3 scripts/night_signal_cloud_review.py --self-test
            python3 scripts/night_signal_cloud_handoff.py --self-test
            python3 scripts/night_signal_cloud_feedback.py --self-test
            python3 scripts/night_signal_runtime_audit.py --self-test
            python3 scripts/publication_schedule_audit.py
          } 2>&1 | tee "$RUNNER_TEMP/gates.log"

      - name: Preserve preflight diagnostics
        if: ${{ always() && env.VALIDATION_ONLY == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: night-signal-preflight-${{ env.ISSUE_DATE }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/apply.log
            ${{ runner.temp }}/gates.log
          if-no-files-found: warn
          retention-days: 14

      - name: Save the draft result for the editor
        if: ${{ always() && env.DRAFT_SHA != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          python3 scripts/night_signal_cloud_feedback.py "$ISSUE_DATE" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --workflow-status "$WORKFLOW_STATUS" \
            --log-directory "$RUNNER_TEMP" \
            --step "restore=${{ steps.restore.outcome }}" \
            --step "apply=${{ steps.apply.outcome }}" \
            --step "gates=${{ steps.gates.outcome }}" \
            --preflight-sha "$DRAFT_SHA" --publish

      - name: Hand a passing current draft to publication
        if: ${{ success() && env.DRAFT_SHA != '' && steps.gates.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$ISSUE_DATE" != "$(TZ=Asia/Tokyo date +%F)" ]]; then
            echo "Historical draft validated; no automatic publication dispatched."
            exit 0
          fi
          endpoint="repos/$GITHUB_REPOSITORY"
          draft_ref="night-signal-preflight-$ISSUE_DATE"
          current_draft="$(gh api "$endpoint/git/ref/heads/$draft_ref" --jq .object.sha)"
          if [[ "$current_draft" != "$DRAFT_SHA" ]]; then
            echo "A newer draft exists; leave publication to its own validation."
            exit 0
          fi
          if [[ "$(python3 scripts/publication_timing.py --issue-deadline "$ISSUE_DATE")" == "missed" ]]; then
            echo "Draft validated after the release deadline; publication will be recorded as late."
          fi
          existing_ref="$(gh api "$endpoint/git/matching-refs/heads/$REVIEW_REF" | jq --arg ref "refs/heads/$REVIEW_REF" '[.[] | select(.ref == $ref)] | length')"
          if [[ "$existing_ref" == "0" ]]; then
            gh api "$endpoint/git/refs" -f "ref=refs/heads/$REVIEW_REF" -f "sha=$BASE_SHA" >/dev/null
          fi
          path="$endpoint/contents/cloud-review/$ISSUE_DATE/editor_review.json"
          base64 -w 0 "$RUNNER_TEMP/editor_review.json" > "$RUNNER_TEMP/preflight-review.base64"
          if ! jq -n --arg branch "$REVIEW_REF" --rawfile content "$RUNNER_TEMP/preflight-review.base64" \
            --arg message "Hand off validated NIGHT SIGNAL draft $DRAFT_SHA" \
            '{branch:$branch,content:$content,message:$message}' |
            gh api "$path" -X PUT --input - >/dev/null; then
            echo "Could not create the official review safely. An existing review will not be overwritten." >&2
            exit 1
          fi
          gh workflow run cloud-review-publish.yml --ref main \
            -f "issue_date=$ISSUE_DATE" -f "review_ref=$REVIEW_REF"

      - name: Require the same trusted main before committing
        id: base_guard
        if: ${{ env.VALIDATION_ONLY != 'true' && steps.already_public.outputs.published != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RECOVERY_ATTEMPT" != "0" ]]; then
            echo "Remote main moved during the bounded recovery attempt." >&2
            exit 1
          fi
          gh workflow run cloud-review-publish.yml --ref main \
            -f "issue_date=$ISSUE_DATE" \
            -f "review_ref=$REVIEW_REF" \
            -f "recovery_attempt=1"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "Trusted main moved; queued one deterministic rebuild from the same review."

      - name: Commit the complete audited publication atomically
        id: commit
        if: ${{ steps.already_public.outputs.published != 'true' && steps.base_guard.outputs.proceed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .night-signal-issue-date \
            'night-brief-web-sample-*.html' \
            details site state
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Audited publication is already committed."
            exit 0
          fi
          git commit -m "Publish NIGHT SIGNAL for $ISSUE_DATE"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push once or queue one same-review rebuild after a race
        id: push
        if: ${{ steps.already_public.outputs.published != 'true' && steps.base_guard.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.commit.outputs.changed }}" != "true" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git push origin HEAD:main; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RECOVERY_ATTEMPT" != "0" ]]; then
            echo "Push raced twice; refusing an unbounded retry." >&2
            exit 1
          fi
          gh workflow run cloud-review-publish.yml --ref main \
            -f "issue_date=$ISSUE_DATE" \
            -f "review_ref=$REVIEW_REF" \
            -f "recovery_attempt=1"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "Push raced with main; queued one deterministic rebuild."

      - name: Dispatch Pages exactly once
        id: pages
        if: ${{ steps.push.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(bash scripts/dispatch_reviewed_pages.sh "$ISSUE_DATE" first)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Watch the one Pages run
        id: first_pages_watch
        continue-on-error: true
        if: ${{ steps.push.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ steps.pages.outputs.run_id }}"
          if gh run watch "$RUN_ID" --exit-status; then
            exit 0
          fi
          STATUS="$(gh run view "$RUN_ID" --json status --jq .status || true)"
          if [[ "$STATUS" != "completed" ]]; then
            gh run watch "$RUN_ID" --exit-status
            exit 0
          fi
          gh run view "$RUN_ID" --log-failed || true
          exit 1

      - name: Retry the same committed Pages deployment once
        id: pages_retry
        if: ${{ steps.push.outputs.proceed == 'true' && steps.first_pages_watch.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FIRST_RUN_ID="${{ steps.pages.outputs.run_id }}"
          STEP="$(gh run view "$FIRST_RUN_ID" --json jobs --jq '[.jobs[].steps[] | select(.name == "Deploy to GitHub Pages") | .conclusion] | if length == 1 then .[0] else "" end')"
          if [[ "$STEP" != "skipped" ]]; then
            echo "The first run may have submitted deployment. Refusing a second submission." >&2
            exit 1
          fi
          RUN_ID="$(bash scripts/dispatch_reviewed_pages.sh "$ISSUE_DATE" retry)"
          gh run watch "$RUN_ID" --exit-status

      - name: Verify origin, root URL, and dated URL
        id: verify
        if: ${{ steps.push.outputs.proceed == 'true' }}
        run: |
          set -o pipefail
          {
            git fetch origin main
            git checkout --detach origin/main
            python3 scripts/publication_audit.py "$ISSUE_DATE"
          } 2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: Preserve reader-side verification evidence
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: night-signal-reader-verification-${{ env.ISSUE_DATE }}-${{ github.run_id }}
          path: ${{ runner.temp }}/verify.log
          if-no-files-found: warn
          retention-days: 90

      - name: Publish compact success or validator feedback for recovery
        if: ${{ always() && env.VALIDATION_ONLY != 'true' && env.ISSUE_DATE != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/night_signal_cloud_feedback.py "$ISSUE_DATE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$RUN_URL" \
            --workflow-status "$WORKFLOW_STATUS" \
            --recovery-attempt "$RECOVERY_ATTEMPT" \
            --log-directory "$RUNNER_TEMP" \
            --receipt-path "state/$ISSUE_DATE/plus_review_receipt.json" \
            --step "apply=${{ steps.apply.outcome }}" \
            --step "restore=${{ steps.restore.outcome }}" \
            --step "gates=${{ steps.gates.outcome }}" \
            --step "base_guard=${{ steps.base_guard.outcome }}" \
            --step "commit=${{ steps.commit.outcome }}" \
            --step "push=${{ steps.push.outcome }}" \
            --step "pages=${{ steps.pages.outcome }}" \
            --step "pages_retry=${{ steps.pages_retry.outcome }}" \
            --step "pages_watch=${{ steps.first_pages_watch.outcome }}" \
            --step "verify=${{ steps.verify.outcome }}" \
            --publish

      - name: Preserve deterministic failure checkpoints
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: night-signal-reviewed-runtime-${{ env.ISSUE_DATE || github.run_id }}
          path: |
            state/${{ env.ISSUE_DATE }}/runtime_checkpoint.json
            state/${{ env.ISSUE_DATE }}/plus_review_receipt.json
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6
