name: Publish reviewed NIGHT SIGNAL
run-name: Publish reviewed NIGHT SIGNAL ${{ inputs.issue_date || github.ref_name }}

on:
  push:
    branches:
      - "night-signal-review-*"
    paths:
      - "cloud-review/**/editor_review.json"
      - "cloud-review/**/editor_correction.json"
  workflow_dispatch:
    inputs:
      issue_date:
        description: "JST issue date to recover."
        required: true
        type: string
      review_ref:
        description: "Review branch named night-signal-review-YYYY-MM-DD."
        required: true
        type: string
      recovery_attempt:
        description: "Bounded deterministic base-race recovery attempt."
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: night-signal-reviewed-publication-${{ inputs.issue_date || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and fetch the isolated review handoff
        id: resolve
        env:
          REQUESTED_ISSUE_DATE: ${{ inputs.issue_date || '' }}
          REQUESTED_REVIEW_REF: ${{ inputs.review_ref || '' }}
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt || '0' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            REVIEW_REF="$GITHUB_REF_NAME"
            ISSUE_DATE="${REVIEW_REF#night-signal-review-}"
          else
            REVIEW_REF="$REQUESTED_REVIEW_REF"
            ISSUE_DATE="$REQUESTED_ISSUE_DATE"
          fi
          if [[ ! "$ISSUE_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid issue date: $ISSUE_DATE" >&2
            exit 1
          fi
          if [[ "$REVIEW_REF" != "night-signal-review-$ISSUE_DATE" ]]; then
            echo "Review ref is not bound to issue date: $REVIEW_REF" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/$REVIEW_REF:refs/remotes/origin/$REVIEW_REF"
          git show \
            "refs/remotes/origin/$REVIEW_REF:cloud-review/$ISSUE_DATE/editor_review.json" \
            > "$RUNNER_TEMP/editor_review.json"
          CORRECTION_SPEC="refs/remotes/origin/$REVIEW_REF:cloud-review/$ISSUE_DATE/editor_correction.json"
          if git cat-file -e "$CORRECTION_SPEC" 2>/dev/null; then
            git show "$CORRECTION_SPEC" > "$RUNNER_TEMP/editor_correction.json"
            echo "CORRECTION_PATH=$RUNNER_TEMP/editor_correction.json" >> "$GITHUB_ENV"
          else
            echo "CORRECTION_PATH=" >> "$GITHUB_ENV"
          fi
          echo "ISSUE_DATE=$ISSUE_DATE" >> "$GITHUB_ENV"
          echo "REVIEW_REF=$REVIEW_REF" >> "$GITHUB_ENV"
          echo "RECOVERY_ATTEMPT=$RECOVERY_ATTEMPT" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Stop when this exact issue is already verified live
        id: already_public
        run: |
          if [[ -n "$CORRECTION_PATH" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Correction overlay requires a same-day rebuild."
            exit 0
          fi
          if python3 scripts/publication_audit.py "$ISSUE_DATE"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "The committed issue and both public URLs are already verified."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore final Evidence without collection or model work
        id: restore
        if: ${{ steps.already_public.outputs.published != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/night_signal_review_artifact.py \
            "$ISSUE_DATE" --restore-only

      - name: Validate cloud provenance and apply every reviewed event
        id: apply
        if: ${{ steps.already_public.outputs.published != 'true' }}
        run: |
          set -o pipefail
          CORRECTION_ARGS=()
          if [[ -n "$CORRECTION_PATH" ]]; then
            CORRECTION_ARGS+=(--correction-path "$CORRECTION_PATH")
          fi
          {
            python3 scripts/night_signal_cloud_review.py "$ISSUE_DATE" \
              --review-ref "$REVIEW_REF" \
              --review-path "$RUNNER_TEMP/editor_review.json" \
              "${CORRECTION_ARGS[@]}"
            python3 scripts/night_signal_plus_editor.py "$ISSUE_DATE" \
              --apply-review "state/$ISSUE_DATE/editor_review.json"
          } 2>&1 | tee "$RUNNER_TEMP/apply.log"

      - name: Render and run deterministic publication gates
        id: gates
        if: ${{ steps.already_public.outputs.published != 'true' }}
        run: |
          set -o pipefail
          {
            python3 scripts/night_signal_publish.py "$ISSUE_DATE" \
              --deploy-existing \
              --deploy-edited-final-evidence \
              --verification-profile deploy
            python3 scripts/night_signal_cloud_review.py --self-test
            python3 scripts/night_signal_cloud_handoff.py --self-test
            python3 scripts/night_signal_cloud_feedback.py --self-test
            python3 scripts/night_signal_runtime_audit.py --self-test
            python3 scripts/publication_schedule_audit.py
          } 2>&1 | tee "$RUNNER_TEMP/gates.log"

      - name: Require the same trusted main before committing
        id: base_guard
        if: ${{ steps.already_public.outputs.published != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" == "$BASE_SHA" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RECOVERY_ATTEMPT" != "0" ]]; then
            echo "Remote main moved during the bounded recovery attempt." >&2
            exit 1
          fi
          gh workflow run cloud-review-publish.yml --ref main \
            -f "issue_date=$ISSUE_DATE" \
            -f "review_ref=$REVIEW_REF" \
            -f "recovery_attempt=1"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "Trusted main moved; queued one deterministic rebuild from the same review."

      - name: Commit the complete audited publication atomically
        id: commit
        if: ${{ steps.already_public.outputs.published != 'true' && steps.base_guard.outputs.proceed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .night-signal-issue-date \
            'night-brief-web-sample-*.html' \
            details site state
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Audited publication is already committed."
            exit 0
          fi
          git commit -m "Publish NIGHT SIGNAL for $ISSUE_DATE"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push once or queue one same-review rebuild after a race
        id: push
        if: ${{ steps.already_public.outputs.published != 'true' && steps.base_guard.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.commit.outputs.changed }}" != "true" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git push origin HEAD:main; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RECOVERY_ATTEMPT" != "0" ]]; then
            echo "Push raced twice; refusing an unbounded retry." >&2
            exit 1
          fi
          gh workflow run cloud-review-publish.yml --ref main \
            -f "issue_date=$ISSUE_DATE" \
            -f "review_ref=$REVIEW_REF" \
            -f "recovery_attempt=1"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "Push raced with main; queued one deterministic rebuild."

      - name: Dispatch Pages exactly once
        id: pages
        if: ${{ steps.push.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow pages.yml --limit 30 \
            --json databaseId --jq '.[].databaseId' \
            > "$RUNNER_TEMP/pages-before.txt"
          gh workflow run pages.yml --ref main \
            -f "issue_date=$ISSUE_DATE" \
            -f deploy_edited_final_evidence=true
          RUN_ID=""
          for attempt in $(seq 1 24); do
            while read -r candidate; do
              if ! grep -qx "$candidate" "$RUNNER_TEMP/pages-before.txt"; then
                RUN_ID="$candidate"
                break 2
              fi
            done < <(
              gh run list --workflow pages.yml --limit 10 \
                --json databaseId --jq '.[].databaseId'
            )
            sleep 5
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "Pages dispatch did not appear within two minutes." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Watch the one Pages run
        id: first_pages_watch
        continue-on-error: true
        if: ${{ steps.push.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ steps.pages.outputs.run_id }}"
          if gh run watch "$RUN_ID" --exit-status; then
            exit 0
          fi
          STATUS="$(gh run view "$RUN_ID" --json status --jq .status || true)"
          if [[ "$STATUS" != "completed" ]]; then
            gh run watch "$RUN_ID" --exit-status
            exit 0
          fi
          gh run view "$RUN_ID" --log-failed || true
          exit 1

      - name: Retry the same committed Pages deployment once
        id: pages_retry
        if: ${{ steps.push.outputs.proceed == 'true' && steps.first_pages_watch.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow pages.yml --limit 30 \
            --json databaseId --jq '.[].databaseId' \
            > "$RUNNER_TEMP/pages-before-retry.txt"
          gh workflow run pages.yml --ref main \
            -f "issue_date=$ISSUE_DATE" \
            -f deploy_edited_final_evidence=true
          RUN_ID=""
          for attempt in $(seq 1 24); do
            while read -r candidate; do
              if ! grep -qx "$candidate" "$RUNNER_TEMP/pages-before-retry.txt"; then
                RUN_ID="$candidate"
                break 2
              fi
            done < <(
              gh run list --workflow pages.yml --limit 10 \
                --json databaseId --jq '.[].databaseId'
            )
            sleep 5
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "Pages recovery dispatch did not appear within two minutes." >&2
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status

      - name: Verify origin, root URL, and dated URL
        id: verify
        if: ${{ steps.push.outputs.proceed == 'true' }}
        run: |
          set -o pipefail
          {
            git fetch origin main
            git checkout --detach origin/main
            python3 scripts/publication_audit.py "$ISSUE_DATE"
          } 2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: Publish compact success or validator feedback for recovery
        if: ${{ always() && env.ISSUE_DATE != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/night_signal_cloud_feedback.py "$ISSUE_DATE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$RUN_URL" \
            --workflow-status "$WORKFLOW_STATUS" \
            --recovery-attempt "$RECOVERY_ATTEMPT" \
            --log-directory "$RUNNER_TEMP" \
            --receipt-path "state/$ISSUE_DATE/plus_review_receipt.json" \
            --step "apply=${{ steps.apply.outcome }}" \
            --step "restore=${{ steps.restore.outcome }}" \
            --step "gates=${{ steps.gates.outcome }}" \
            --step "base_guard=${{ steps.base_guard.outcome }}" \
            --step "commit=${{ steps.commit.outcome }}" \
            --step "push=${{ steps.push.outcome }}" \
            --step "pages=${{ steps.pages.outcome }}" \
            --step "pages_retry=${{ steps.pages_retry.outcome }}" \
            --step "pages_watch=${{ steps.first_pages_watch.outcome }}" \
            --step "verify=${{ steps.verify.outcome }}" \
            --publish

      - name: Preserve deterministic failure checkpoints
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: night-signal-reviewed-runtime-${{ env.ISSUE_DATE || github.run_id }}
          path: |
            state/${{ env.ISSUE_DATE }}/runtime_checkpoint.json
            state/${{ env.ISSUE_DATE }}/plus_review_receipt.json
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6
