name: NIGHT SIGNAL Preflight

on:
  workflow_dispatch:
  schedule:
    - cron: "30 08 * * *"
    - cron: "00 11 * * *"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check selected generated issue
        run: |
          ISSUE_DATE="$(TZ=Asia/Tokyo date +%F)"
          if [[ ! "$ISSUE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Computed NIGHT SIGNAL issue date is invalid: ${ISSUE_DATE}" >&2
            exit 1
          fi
          python3 scripts/night_signal_state.py --self-test
          python3 scripts/night_signal_collect.py --self-test
          python3 scripts/night_signal_synthesize.py --self-test
          if [[ ! -d "state/${ISSUE_DATE}" ]]; then
            python3 scripts/night_signal_state.py --write-collection-plan "$ISSUE_DATE"
          elif [[ ! -f "state/${ISSUE_DATE}/collection_plan.json" ]]; then
            python3 scripts/night_signal_state.py --write-collection-plan "$ISSUE_DATE"
          fi
          if [[ -d "state/${ISSUE_DATE}" \
            && ! -f "state/${ISSUE_DATE}/issue.json" \
            && ( -f "state/${ISSUE_DATE}/observations.jsonl" || -f "state/${ISSUE_DATE}/observations.json" ) \
            && ( -f "state/${ISSUE_DATE}/candidates.jsonl" || -f "state/${ISSUE_DATE}/candidates.json" ) \
            && ( -f "state/${ISSUE_DATE}/decisions.jsonl" || -f "state/${ISSUE_DATE}/decisions.json" ) \
            && ( -f "state/${ISSUE_DATE}/cards.jsonl" || -f "state/${ISSUE_DATE}/cards.json" ) \
            && -f "state/${ISSUE_DATE}/coverage_manifest.json" ]]; then
            python3 scripts/night_signal_state.py --assemble-issue-state "$ISSUE_DATE"
          fi
          if [[ -f "state/${ISSUE_DATE}/issue.json" ]]; then
            python3 scripts/night_signal_state.py --validate-issue "state/${ISSUE_DATE}/issue.json"
            python3 scripts/night_signal_state.py --generate-issue "state/${ISSUE_DATE}/issue.json"
            python3 scripts/sync_site.py "$ISSUE_DATE"
          fi
          python3 scripts/night_signal_state.py --readiness --date "$ISSUE_DATE"
          python3 scripts/guardrail_inventory.py
          python3 scripts/current_issue_audit.py "$ISSUE_DATE"
          python3 scripts/coverage_audit.py "$ISSUE_DATE"
          python3 scripts/pre22_audit.py "$ISSUE_DATE"
