name: NIGHT SIGNAL Preflight

on:
  workflow_dispatch:
  schedule:
    - cron: "30 08 * * *"
    - cron: "30 10 * * *"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check selected generated issue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ISSUE_DATE="$(TZ=Asia/Tokyo date +%F)"
          if [[ ! "$ISSUE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Computed NIGHT SIGNAL issue date is invalid: ${ISSUE_DATE}" >&2
            exit 1
          fi
          python3 scripts/night_signal_publish.py "$ISSUE_DATE" --preflight
