name: NIGHT SIGNAL Preflight

on:
  workflow_dispatch:
  schedule:
    - cron: "00 08 * * *"
    - cron: "00 09 * * *"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check selected generated issue
        run: |
          ISSUE_DATE="$(python3 scripts/night_signal_publish.py --resolve-issue-date)"
          python3 scripts/night_signal_publish.py "$ISSUE_DATE" --preflight
