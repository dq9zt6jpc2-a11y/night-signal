name: NIGHT SIGNAL Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check today's generated issue
        run: |
          ISSUE_DATE="$(TZ=Asia/Tokyo date +%F)"
          python3 scripts/guardrail_inventory.py
          python3 scripts/coverage_audit.py "$ISSUE_DATE"
          python3 scripts/pre22_audit.py "$ISSUE_DATE"
