name: NIGHT SIGNAL Unattended Collection

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: "JST issue date. Empty uses today's JST date."
        required: false
        type: string
      canary_only:
        description: "Verify GitHub Models access without collecting."
        required: false
        default: false
        type: boolean
      force:
        description: "Recollect even when an evening-fresh issue exists."
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Run collection and audits without committing."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "05 09 * * *"
    - cron: "35 09 * * *"
    - cron: "05 10 * * *"
    - cron: "35 10 * * *"
    - cron: "50 10 * * *"

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: night-signal-unattended-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NIGHT_SIGNAL_MODEL_CONCURRENCY: 2
      NIGHT_SIGNAL_ALLOW_EXPLICIT_STALE: ${{ inputs.issue_date != '' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve issue date
        env:
          REQUESTED_ISSUE_DATE: ${{ inputs.issue_date || '' }}
        run: |
          ISSUE_DATE="$(python3 scripts/night_signal_publish.py --resolve-issue-date --event-name "$GITHUB_EVENT_NAME" --requested-issue-date "${REQUESTED_ISSUE_DATE:-}")"
          echo "ISSUE_DATE=$ISSUE_DATE" >> "$GITHUB_ENV"

      - name: Classify startup readiness
        run: python3 scripts/night_signal_runtime_audit.py "$ISSUE_DATE"

      - name: Verify GitHub Models access
        run: python3 scripts/night_signal_unattended_collect.py --canary

      - name: Stop after canary
        if: ${{ inputs.canary_only == true }}
        run: echo "GitHub Models canary completed."

      - name: Collect all categories
        if: ${{ inputs.canary_only != true }}
        timeout-minutes: 70
        env:
          FORCE_COLLECTION: ${{ inputs.force || false }}
        run: |
          if [[ "$FORCE_COLLECTION" == "true" ]]; then
            python3 scripts/night_signal_unattended_collect.py "$ISSUE_DATE"
          else
            python3 scripts/night_signal_unattended_collect.py "$ISSUE_DATE" --skip-if-fresh
          fi

      - name: Build and audit issue
        if: ${{ inputs.canary_only != true }}
        timeout-minutes: 20
        run: |
          python3 scripts/night_signal_import_research.py "$ISSUE_DATE"
          python3 scripts/night_signal_runtime_audit.py "$ISSUE_DATE"
          python3 scripts/night_signal_publish.py "$ISSUE_DATE" --deploy-existing --verification-profile deploy
          PYTHONPYCACHEPREFIX=tmp/pycache python3 -m py_compile scripts/*.py
          git diff --check

      - name: Commit audited issue
        if: ${{ inputs.canary_only != true && inputs.dry_run != true }}
        run: |
          git config user.name "night-signal-bot"
          git config user.email "night-signal-bot@users.noreply.github.com"
          git add .night-signal-issue-date
          git add "night-brief-web-sample-$ISSUE_DATE.html"
          git add details site "state/$ISSUE_DATE"
          if git diff --cached --quiet; then
            echo "No audited issue changes to commit."
            exit 0
          fi
          git commit -m "Publish NIGHT SIGNAL for $ISSUE_DATE"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch Pages publication
        if: ${{ inputs.canary_only != true && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "PAGES_DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          gh workflow run pages.yml \
            --ref main \
            -f issue_date="$ISSUE_DATE"

      - name: Wait for Pages publication
        if: ${{ inputs.canary_only != true && inputs.dry_run != true }}
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=""
          for attempt in $(seq 1 40); do
            RUN_ID="$(gh run list \
              --workflow pages.yml \
              --branch main \
              --event workflow_dispatch \
              --json databaseId,createdAt \
              --jq '.[] | select(.createdAt >= env.PAGES_DISPATCHED_AT) | .databaseId' \
              | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 15
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "No Pages publication run appeared after $PAGES_DISPATCHED_AT" >&2
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status
          python3 scripts/publication_audit.py "$ISSUE_DATE"

      - name: Report dry run
        if: ${{ inputs.canary_only != true && inputs.dry_run == true }}
        run: |
          echo "Full unattended collection and all audits passed."
          git status --short
