name: NIGHT SIGNAL Evidence Collection

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: "JST issue date. Empty uses today's JST date."
        required: false
        type: string
  schedule:
    - cron: "27 02 * * *"
    - cron: "27 05 * * *"
    - cron: "17 07 * * *"
    - cron: "47 07 * * *"
    - cron: "17 08 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: night-signal-evidence-collection
  cancel-in-progress: false

jobs:
  owner_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      duplicate_of: ${{ steps.guard.outputs.duplicate_of }}
    steps:
      - name: Checkout owner guard
        uses: actions/checkout@v5

      - name: Guard against a queued duplicate collector
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/night_signal_run_guard.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow unattended-collection.yml \
            --run-id "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report duplicate collector skip
        if: ${{ steps.guard.outputs.proceed != 'true' }}
        run: |
          echo "Skipped queued duplicate of collection run ${{ steps.guard.outputs.duplicate_of }}."

  collect:
    needs: owner_guard
    if: ${{ needs.owner_guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Sync delayed schedule to latest main
        if: ${{ github.event_name == 'schedule' }}
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: Resolve issue date
        env:
          REQUESTED_ISSUE_DATE: ${{ inputs.issue_date || '' }}
        run: |
          ISSUE_DATE="$(python3 scripts/night_signal_publish.py --resolve-issue-date --event-name "$GITHUB_EVENT_NAME" --requested-issue-date "${REQUESTED_ISSUE_DATE:-}")"
          echo "ISSUE_DATE=$ISSUE_DATE" >> "$GITHUB_ENV"

      - name: Evaluate final collection window
        id: timing
        run: |
          ACTION="$(python3 scripts/publication_timing.py --decision --event-name "$GITHUB_EVENT_NAME")"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Detect an already verified publication
        id: current_publication
        if: ${{ steps.timing.outputs.action != 'wait' }}
        run: |
          if python3 scripts/publication_audit.py "$ISSUE_DATE"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect a reusable final Evidence artifact
        id: evidence_artifact
        if: ${{ steps.timing.outputs.action != 'wait' && steps.current_publication.outputs.published != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/night_signal_run_guard.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow unattended-collection.yml \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-name "night-signal-state-$ISSUE_DATE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Enforce publication deadline
        if: ${{ steps.timing.outputs.action == 'missed' && steps.current_publication.outputs.published != 'true' && steps.evidence_artifact.outputs.artifact_ready != 'true' }}
        run: |
          echo "The 19:00 JST publication deadline passed before a usable Evidence artifact was available." >&2
          exit 1

      - name: Reuse completed Evidence without recollection
        if: ${{ steps.current_publication.outputs.published != 'true' && steps.evidence_artifact.outputs.artifact_ready == 'true' }}
        run: |
          echo "Reusable final Evidence artifact ${{ steps.evidence_artifact.outputs.artifact_id }} is already available."
          echo "Skipping duplicate web collection."

      - name: Collect complete web Evidence and prepare the Plus review packet
        id: packet
        if: ${{ steps.timing.outputs.action == 'run' && steps.current_publication.outputs.published != 'true' && steps.evidence_artifact.outputs.artifact_ready != 'true' }}
        run: |
          python3 scripts/night_signal_collect.py "$ISSUE_DATE"
          python3 scripts/night_signal_plus_editor.py "$ISSUE_DATE" --prepare --output "state/$ISSUE_DATE/editor_packet.json"
          python3 scripts/night_signal_eval.py --self-test
          python3 scripts/coverage_audit.py --self-test
          python3 scripts/night_signal_plus_editor.py --self-test
          PYTHONPYCACHEPREFIX=tmp/pycache python3 -m py_compile scripts/*.py
          git diff --check
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Save the complete Evidence and compact review packet
        if: ${{ always() && steps.packet.outputs.created == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: night-signal-state-${{ env.ISSUE_DATE }}
          path: |
            state/${{ env.ISSUE_DATE }}/evidence.json
            state/${{ env.ISSUE_DATE }}/editor_packet.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Report zero-cost collection boundary
        if: ${{ steps.packet.outputs.created == 'true' }}
        run: |
          echo "Evidence and every distinct candidate event are ready for one Codex Plus review."
          echo "Repository model API requests: 0"
          echo "Additional paid API requests: 0"
