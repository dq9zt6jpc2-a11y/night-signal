name: NIGHT SIGNAL Evidence Collection

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: "JST issue date. Empty uses today's JST date."
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: night-signal-evidence-collection
  cancel-in-progress: false

jobs:
  owner_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      duplicate_of: ${{ steps.guard.outputs.duplicate_of }}
    steps:
      - name: Checkout owner guard
        uses: actions/checkout@v5

      - name: Guard against a queued duplicate collector
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/night_signal_run_guard.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow unattended-collection.yml \
            --run-id "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report duplicate collector skip
        if: ${{ steps.guard.outputs.proceed != 'true' }}
        run: |
          echo "Skipped queued duplicate of collection run ${{ steps.guard.outputs.duplicate_of }}."

  collect:
    needs: owner_guard
    if: ${{ needs.owner_guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Sync delayed schedule to latest main
        if: ${{ github.event_name == 'schedule' }}
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: Resolve issue date
        env:
          REQUESTED_ISSUE_DATE: ${{ inputs.issue_date || '' }}
        run: |
          ISSUE_DATE="$(python3 scripts/night_signal_publish.py --resolve-issue-date --event-name "$GITHUB_EVENT_NAME" --requested-issue-date "${REQUESTED_ISSUE_DATE:-}")"
          echo "ISSUE_DATE=$ISSUE_DATE" >> "$GITHUB_ENV"

      - name: Record the issue date for the completion watchdog
        run: printf '%s\n' "$ISSUE_DATE" > "$RUNNER_TEMP/collection-issue-date"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: collection-issue-date
          path: ${{ runner.temp }}/collection-issue-date
          retention-days: 3

      - name: Evaluate final collection window
        id: timing
        run: |
          ACTION="$(python3 scripts/publication_timing.py --decision --event-name "$GITHUB_EVENT_NAME")"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$ACTION" == "wait" ]]; then
            WAIT_SECONDS="$(python3 scripts/publication_timing.py --near-window-wait-seconds --max-wait-minutes 30)"
            if (( WAIT_SECONDS > 0 )); then
              echo "Retaining this runner for ${WAIT_SECONDS}s until the final collection window."
              sleep "$WAIT_SECONDS"
              ACTION="$(python3 scripts/publication_timing.py --decision --event-name "$GITHUB_EVENT_NAME")"
            fi
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Detect an already verified publication
        id: current_publication
        if: ${{ steps.timing.outputs.action != 'wait' }}
        run: |
          if python3 scripts/publication_audit.py "$ISSUE_DATE"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect a reusable final Evidence artifact
        id: evidence_artifact
        if: ${{ steps.timing.outputs.action != 'wait' && steps.current_publication.outputs.published != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/night_signal_run_guard.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow unattended-collection.yml \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-name "night-signal-state-$ISSUE_DATE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore reusable Evidence for a missing cloud handoff
        id: validated_evidence
        if: ${{ steps.current_publication.outputs.published != 'true' && steps.evidence_artifact.outputs.artifact_ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 scripts/night_signal_review_artifact.py "$ISSUE_DATE" --restore-only; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Validated final Evidence was restored without recollection."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Artifact metadata matched, but its contents failed final Evidence validation." >&2
          fi

      - name: Enforce publication deadline
        if: ${{ steps.timing.outputs.action == 'missed' && steps.current_publication.outputs.published != 'true' && steps.validated_evidence.outputs.ready != 'true' }}
        run: |
          echo "The publication deadline passed before a valid final Evidence artifact was available." >&2
          exit 1

      - name: Collect complete web Evidence and prepare the Plus review packet
        id: packet
        if: ${{ steps.timing.outputs.action == 'run' && steps.current_publication.outputs.published != 'true' && steps.validated_evidence.outputs.ready != 'true' }}
        run: |
          python3 scripts/night_signal_collect.py "$ISSUE_DATE"
          python3 scripts/night_signal_plus_editor.py "$ISSUE_DATE" --prepare --output "state/$ISSUE_DATE/editor_packet.json"
          python3 scripts/night_signal_eval.py --self-test
          python3 scripts/coverage_audit.py --self-test
          python3 scripts/night_signal_plus_editor.py --self-test
          PYTHONPYCACHEPREFIX=tmp/pycache python3 -m py_compile scripts/*.py
          git diff --check
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Validate final Evidence before naming it reusable
        id: final_packet
        if: ${{ steps.packet.outputs.created == 'true' }}
        run: |
          if python3 scripts/night_signal_review_artifact.py "$ISSUE_DATE" --check-local-final; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if (( status == 2 )); then
              echo "ready=false" >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi

      - name: Save the complete Evidence and compact review packet
        if: ${{ always() && steps.final_packet.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: night-signal-state-${{ env.ISSUE_DATE }}
          path: |
            state/${{ env.ISSUE_DATE }}/evidence.json
            state/${{ env.ISSUE_DATE }}/editor_packet.json
            state/${{ env.ISSUE_DATE }}/source_gap_report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Preserve pre-editor source diagnostics after a failed collection stage
        if: ${{ always() && steps.packet.outcome == 'failure' && env.ISSUE_DATE != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: night-signal-collection-diagnostics-${{ env.ISSUE_DATE }}-${{ github.run_id }}
          path: |
            state/${{ env.ISSUE_DATE }}/evidence.json
            state/${{ env.ISSUE_DATE }}/source_gap_report.json
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6

      - name: Publish the immutable PC-independent review handoff
        id: handoff
        if: ${{ steps.current_publication.outputs.published != 'true' && (steps.final_packet.outputs.ready == 'true' || steps.validated_evidence.outputs.ready == 'true') }}
        run: |
          python3 scripts/night_signal_cloud_handoff.py "$ISSUE_DATE" --publish

      - name: Record editor handoff separately from deadline outcome
        if: ${{ always() && steps.handoff.outcome == 'success' }}
        run: |
          {
            echo "### $ISSUE_DATE: editor handoff ready"
            echo "Handed off at $(TZ=Asia/Tokyo date -Is)."
            echo "Input branch: night-signal-evidence-$ISSUE_DATE"
            echo "This confirms material is ready for editing. Reader-side publication is checked separately."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report zero-cost collection boundary
        if: ${{ steps.handoff.outcome == 'success' }}
        run: |
          echo "Evidence and every distinct candidate event are ready on the immutable cloud handoff branch."
          echo "Repository model API requests: 0"
          echo "Additional paid API requests: 0"

      - name: Fail a late run if the issue still has no verified public page
        if: ${{ always() && env.ISSUE_DATE != '' }}
        run: |
          NOW_JST="$(TZ=Asia/Tokyo date +%F)"
          DEADLINE_ACTION="$(python3 scripts/publication_timing.py --issue-deadline "$ISSUE_DATE")"
          if [[ "$ISSUE_DATE" < "$NOW_JST" ]]; then
            python3 scripts/publication_audit.py "$ISSUE_DATE" --public-date-only
          elif [[ "$DEADLINE_ACTION" == "missed" ]]; then
            python3 scripts/publication_audit.py "$ISSUE_DATE"
          fi
