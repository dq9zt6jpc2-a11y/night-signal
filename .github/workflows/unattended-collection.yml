name: NIGHT SIGNAL Unattended Collection

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: "JST issue date. Empty uses today's JST date."
        required: false
        type: string
      reuse_evidence:
        description: "Resume the canonical pipeline from a valid saved Evidence checkpoint."
        required: false
        default: true
        type: boolean
      reprocess_existing:
        description: "Re-edit an audited issue from checkpoints only, without model requests."
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Run collection and audits without committing."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "27 02 * * *"
    - cron: "27 05 * * *"
    - cron: "17 07 * * *"
    - cron: "47 07 * * *"

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: night-signal-unattended-collection
  cancel-in-progress: false

jobs:
  owner_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      duplicate_of: ${{ steps.guard.outputs.duplicate_of }}
    steps:
      - name: Checkout owner guard
        uses: actions/checkout@v5

      - name: Guard against a queued duplicate owner
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/night_signal_run_guard.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow unattended-collection.yml \
            --run-id "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report duplicate owner skip
        if: ${{ steps.guard.outputs.proceed != 'true' }}
        run: |
          echo "Skipped queued duplicate of owner run ${{ steps.guard.outputs.duplicate_of }}."

  collect:
    needs: owner_guard
    if: ${{ needs.owner_guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync delayed schedule to latest main
        if: ${{ github.event_name == 'schedule' }}
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: Resolve issue date
        env:
          REQUESTED_ISSUE_DATE: ${{ inputs.issue_date || '' }}
        run: |
          ISSUE_DATE="$(python3 scripts/night_signal_publish.py --resolve-issue-date --event-name "$GITHUB_EVENT_NAME" --requested-issue-date "${REQUESTED_ISSUE_DATE:-}")"
          echo "ISSUE_DATE=$ISSUE_DATE" >> "$GITHUB_ENV"

      - name: Resolve recovery mode
        id: recovery
        env:
          REQUESTED_REUSE: ${{ inputs.reuse_evidence }}
          REQUESTED_REPROCESS: ${{ inputs.reprocess_existing }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "reprocess=false" >> "$GITHUB_OUTPUT"
          elif [[ "${REQUESTED_REUSE:-true}" == "false" ]]; then
            if [[ "${REQUESTED_REPROCESS:-false}" == "true" ]]; then
              echo "Reprocessing requires Evidence reuse." >&2
              exit 1
            fi
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "reprocess=false" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "reprocess=${REQUESTED_REPROCESS:-false}" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate publication window
        id: timing
        run: |
          ACTION="$(python3 scripts/publication_timing.py --decision --event-name "$GITHUB_EVENT_NAME")"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Detect an already verified publication
        id: current_publication
        if: ${{ steps.timing.outputs.action != 'wait' || steps.recovery.outputs.reprocess == 'true' }}
        run: |
          if python3 scripts/publication_audit.py "$ISSUE_DATE"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce publication deadline
        if: ${{ steps.timing.outputs.action == 'missed' && steps.current_publication.outputs.published != 'true' }}
        run: |
          echo "The 19:00 JST publication deadline passed before an eligible run started." >&2
          exit 1

      - name: Resolve build decision
        id: operation
        env:
          REPROCESS_EXISTING: ${{ steps.recovery.outputs.reprocess }}
          ALREADY_PUBLISHED: ${{ steps.current_publication.outputs.published }}
          TIMING_ACTION: ${{ steps.timing.outputs.action }}
        run: |
          if [[ "$REPROCESS_EXISTING" == "true" ]]; then
            if [[ "$ALREADY_PUBLISHED" != "true" ]]; then
              echo "Checkpoint-only reprocessing requires an already audited publication." >&2
              exit 1
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TIMING_ACTION" == "run" && "$ALREADY_PUBLISHED" != "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit current model catalog
        if: ${{ steps.operation.outputs.run == 'true' && steps.recovery.outputs.reprocess != 'true' }}
        run: |
          python3 scripts/night_signal_model_audit.py --output "$RUNNER_TEMP/night-signal-model-audit.json"

      - name: Locate latest Evidence checkpoint
        id: checkpoint
        if: ${{ steps.operation.outputs.run == 'true' && steps.recovery.outputs.reuse == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: night-signal-state-${{ env.ISSUE_DATE }}
          REPROCESS_EXISTING: ${{ steps.recovery.outputs.reprocess }}
        run: |
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=20" \
            --jq '([.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id) // empty')"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [[ -n "$RUN_ID" ]]; then
            echo "Evidence checkpoint found in run $RUN_ID."
          else
            echo "No Evidence checkpoint is available."
          fi
          if [[ "$REPROCESS_EXISTING" == "true" && -z "$RUN_ID" ]]; then
            echo "Checkpoint-only reprocessing cannot run without a saved artifact." >&2
            exit 1
          fi

      - name: Restore Evidence checkpoint
        if: ${{ steps.checkpoint.outputs.run_id != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: night-signal-state-${{ env.ISSUE_DATE }}
          path: state/${{ env.ISSUE_DATE }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.checkpoint.outputs.run_id }}

      - name: Build audited issue
        if: ${{ steps.operation.outputs.run == 'true' }}
        timeout-minutes: 70
        env:
          REUSE_EVIDENCE: ${{ steps.recovery.outputs.reuse }}
          REPROCESS_EXISTING: ${{ steps.recovery.outputs.reprocess }}
        run: |
          if [[ "$REPROCESS_EXISTING" == "true" ]]; then
            python3 scripts/night_signal_publish.py "$ISSUE_DATE" --reuse-evidence --reprocess-existing --verification-profile deploy
          elif [[ "$REUSE_EVIDENCE" == "true" ]]; then
            python3 scripts/night_signal_publish.py "$ISSUE_DATE" --reuse-evidence --verification-profile deploy
          else
            python3 scripts/night_signal_publish.py "$ISSUE_DATE" --verification-profile deploy
          fi
          PYTHONPYCACHEPREFIX=tmp/pycache python3 -m py_compile scripts/*.py
          git diff --check

      - name: Save Evidence checkpoint
        if: ${{ always() && steps.operation.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: night-signal-state-${{ env.ISSUE_DATE }}
          path: |
            state/${{ env.ISSUE_DATE }}/evidence.json
            state/${{ env.ISSUE_DATE }}/editor_checkpoint.json
            state/${{ env.ISSUE_DATE }}/issue.json
            state/${{ env.ISSUE_DATE }}/runtime_checkpoint.json
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6

      - name: Commit audited issue
        if: ${{ inputs.dry_run != true && steps.operation.outputs.run == 'true' }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "Remote main changed during issue generation; refusing to publish a rebased issue." >&2
            exit 1
          fi
          git config user.name "night-signal-bot"
          git config user.email "night-signal-bot@users.noreply.github.com"
          git add -A -- .night-signal-issue-date 'night-brief-web-sample-*.html' details site state
          if git diff --cached --quiet; then
            echo "No audited issue changes to commit."
            exit 0
          fi
          git commit -m "Publish NIGHT SIGNAL for $ISSUE_DATE"
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Tracked publication files changed after commit." >&2
            git status --short
            exit 1
          fi
          git push origin HEAD:main

      - name: Dispatch Pages publication
        if: ${{ inputs.dry_run != true && steps.operation.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "PAGES_DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          gh workflow run pages.yml \
            --ref main \
            -f issue_date="$ISSUE_DATE"

      - name: Wait for Pages publication
        if: ${{ inputs.dry_run != true && steps.operation.outputs.run == 'true' }}
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=""
          for attempt in $(seq 1 40); do
            RUN_ID="$(gh run list \
              --workflow pages.yml \
              --branch main \
              --event workflow_dispatch \
              --json databaseId,createdAt \
              --jq '.[] | select(.createdAt >= env.PAGES_DISPATCHED_AT) | .databaseId' \
              | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 15
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "No Pages publication run appeared after $PAGES_DISPATCHED_AT" >&2
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status

      - name: Report dry run
        if: ${{ inputs.dry_run == true && steps.operation.outputs.run == 'true' }}
        run: |
          echo "Full unattended collection and all audits passed."
          git status --short
