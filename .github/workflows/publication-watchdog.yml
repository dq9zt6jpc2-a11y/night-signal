name: Audit and recover NIGHT SIGNAL publication
run-name: Audit NIGHT SIGNAL publication ${{ inputs.issue_date || github.run_id }}

on:
  workflow_run:
    workflows:
      - Publish reviewed NIGHT SIGNAL
      - NIGHT SIGNAL Evidence Collection
    types:
      - completed
  schedule:
    # Check the primary editor before the 17:00 JST recovery editor.
    - cron: "23 04 * * *"
    - cron: "30 07 * * *"
    - cron: "20 08 * * *"
    - cron: "45 09 * * *"
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      issue_date:
        description: "JST issue date to audit. Empty uses today's date."
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: night-signal-publication-watchdog
  cancel-in-progress: false

jobs:
  audit_recover:
    if: ${{ github.event_name != 'workflow_run' || !startsWith(github.event.workflow_run.display_title, 'Preflight NIGHT SIGNAL ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync delayed schedule to latest main
        if: ${{ github.event_name == 'schedule' }}
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: Retrieve the originating collection date
        if: ${{ github.event.workflow_run.name == 'NIGHT SIGNAL Evidence Collection' }}
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: collection-issue-date
          path: ${{ runner.temp }}/originating-issue
        continue-on-error: true

      - name: Resolve issue date
        env:
          REQUESTED_ISSUE_DATE: ${{ inputs.issue_date || '' }}
        run: |
          ISSUE_DATE="$(python3 scripts/night_signal_publish.py \
            --resolve-issue-date \
            --event-name "$GITHUB_EVENT_NAME" \
            --requested-issue-date "${REQUESTED_ISSUE_DATE:-}")"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            REVIEW_BRANCH="$(jq -r '.workflow_run.head_branch // ""' "$GITHUB_EVENT_PATH")"
            if [[ "$REVIEW_BRANCH" =~ ^night-signal-review-(20[0-9]{2}-[0-9]{2}-[0-9]{2})$ ]]; then
              ISSUE_DATE="${BASH_REMATCH[1]}"
            fi
          fi
          ORIGIN_DATE="$RUNNER_TEMP/originating-issue/collection-issue-date"
          if [[ "${{ github.event.workflow_run.name }}" == "NIGHT SIGNAL Evidence Collection" && ! -f "$ORIGIN_DATE" ]]; then
            echo "Collector issue date unavailable. A scheduled audit will reconcile the issue." >&2
            exit 1
          fi
          if [[ -f "$ORIGIN_DATE" ]]; then
            ISSUE_DATE="$(<"$ORIGIN_DATE")"
            [[ "$ISSUE_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          fi
          echo "ISSUE_DATE=$ISSUE_DATE" >> "$GITHUB_ENV"

      - name: Classify the live stage without changing state
        id: initial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/night_signal_operational_audit.py "$ISSUE_DATE" \
            --report-only \
            --github-output "$GITHUB_OUTPUT" \
            | tee "$RUNNER_TEMP/initial-operational-audit.json"

      - name: Recover a missing collection within the full collection window
        if: ${{ github.event_name == 'schedule' && steps.initial.outputs.stage == 'evidence_missing' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW_JST="$(TZ=Asia/Tokyo date +%H%M)"
          if [[ "$NOW_JST" -lt 1315 || "$NOW_JST" -gt 1345 ]]; then
            exit 0
          fi
          ACTIVE="$(gh run list --workflow unattended-collection.yml --limit 30 \
            --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [[ "$ACTIVE" != "0" ]]; then
            exit 0
          fi
          # Collection may have finished between the initial audit and the run lookup.
          RECHECK="$RUNNER_TEMP/collection-recovery-recheck.json"
          python3 scripts/night_signal_operational_audit.py "$ISSUE_DATE" --report-only > "$RECHECK"
          NOW_JST="$(TZ=Asia/Tokyo date +%H%M)"
          if [[ "$NOW_JST" -ge 1315 && "$NOW_JST" -le 1345 ]] &&
             jq -e '.stage == "evidence_missing"' "$RECHECK" >/dev/null; then
            gh workflow run unattended-collection.yml --ref main -f "issue_date=$ISSUE_DATE"
          fi

      - name: Report the dates still missing from the archive
        if: ${{ github.event_name == 'schedule' || github.event.workflow_run.name == 'NIGHT SIGNAL Evidence Collection' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/night_signal_archive_gaps.py >> "$GITHUB_STEP_SUMMARY"

      - name: Reuse the same review for one deterministic recovery
        id: recovery
        continue-on-error: true
        if: ${{ steps.initial.outputs.published != 'true' && steps.initial.outputs.recoverable == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(
            gh run list --workflow cloud-review-publish.yml --limit 50 \
              --json databaseId,displayTitle,status \
            | jq -r --arg date "$ISSUE_DATE" \
              '.[] | select((.displayTitle | contains($date)) and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")) | .databaseId' \
            | head -1
          )"
          if [[ -z "$RUN_ID" ]]; then
            COMPLETED_RECOVERY_ID="$(
              gh run list --workflow cloud-review-publish.yml --limit 50 \
                --json databaseId,displayTitle,status,event \
              | jq -r --arg date "$ISSUE_DATE" \
                '.[] | select((.displayTitle | contains($date)) and .event == "workflow_dispatch" and .status == "completed") | .databaseId' \
              | head -1
            )"
            if [[ -n "$COMPLETED_RECOVERY_ID" ]]; then
              echo "Bounded recovery run $COMPLETED_RECOVERY_ID already completed; refusing another dispatch." >&2
              exit 1
            fi
            gh run list --workflow cloud-review-publish.yml --limit 50 \
              --json databaseId --jq '.[].databaseId' \
              > "$RUNNER_TEMP/review-runs-before.txt"
            gh workflow run cloud-review-publish.yml --ref main \
              -f "issue_date=$ISSUE_DATE" \
              -f "review_ref=night-signal-review-$ISSUE_DATE" \
              -f "recovery_attempt=1"
            for attempt in $(seq 1 24); do
              while read -r candidate; do
                if ! grep -qx "$candidate" "$RUNNER_TEMP/review-runs-before.txt"; then
                  RUN_ID="$candidate"
                  break 2
                fi
              done < <(
                gh run list --workflow cloud-review-publish.yml --limit 15 \
                  --json databaseId,displayTitle \
                | jq -r --arg date "$ISSUE_DATE" \
                  '.[] | select(.displayTitle | contains($date)) | .databaseId'
              )
              sleep 5
            done
          fi
          if [[ -z "$RUN_ID" ]]; then
            echo "The bounded reviewed-publication recovery did not appear." >&2
            exit 1
          fi
          echo "Recovery run $RUN_ID will trigger the final audit upon completion."

      - name: Re-audit after any bounded recovery
        id: final
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.initial.outputs.published }}" == "true" ]]; then
            echo "stage=published_verified" >> "$GITHUB_OUTPUT"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "recoverable=false" >> "$GITHUB_OUTPUT"
            echo "needs_editor_action=false" >> "$GITHUB_OUTPUT"
            echo "activation_proven_today=${{ steps.initial.outputs.activation_proven_today }}" >> "$GITHUB_OUTPUT"
            echo "recovery_attempt=${{ steps.initial.outputs.recovery_attempt }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -o pipefail
          python3 scripts/night_signal_operational_audit.py "$ISSUE_DATE" \
            --report-only \
            --github-output "$GITHUB_OUTPUT" \
            | tee "$RUNNER_TEMP/final-operational-audit.json"

      - name: Record whether independent editing fits the deadline
        if: ${{ always() && steps.final.outcome == 'success' && steps.initial.outputs.published != 'true' }}
        run: |
          set -o pipefail
          python3 scripts/night_signal_editor_recovery_decision.py \
            "$RUNNER_TEMP/final-operational-audit.json" \
            | tee "$RUNNER_TEMP/editor-recovery-operational-audit.json"

      - name: Preserve the deterministic reliability report for 30 days
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: night-signal-operational-audit-${{ env.ISSUE_DATE }}-${{ github.run_id }}
          path: ${{ runner.temp }}/*-operational-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce the actual deadline without starting expensive work late
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.final.outputs.published }}" == "true" ]]; then
            echo "Verified publication is live for $ISSUE_DATE."
            exit 0
          fi
          STAGE="${{ steps.final.outputs.stage }}"
          if [[ "$STAGE" == "review_correction_exhausted" ]]; then
            echo "NIGHT SIGNAL review correction failed; publication needs an operator before the deadline." >&2
            echo "stage=$STAGE" >&2
            echo "The watchdog cannot repair unsupported editorial claims without another reviewed correction." >&2
            exit 1
          fi
          NOW_JST="$(TZ=Asia/Tokyo date +%H%M)"
          if [[ "$STAGE" == "review_missing_owner_heartbeat_missing" && "$NOW_JST" -ge 1630 ]]; then
            echo "NIGHT SIGNAL Web owner did not prove GitHub access at the scheduled checkpoint." >&2
            echo "stage=$STAGE" >&2
            echo "No Evidence recollection or model review was repeated." >&2
            exit 1
          fi
          if [[ "$STAGE" == "review_missing_after_owner_heartbeat" && "$NOW_JST" -ge 1720 ]]; then
            echo "NIGHT SIGNAL Web owner started but did not submit a review by the recovery checkpoint." >&2
            echo "stage=$STAGE" >&2
            echo "No Evidence recollection or model review was repeated." >&2
            exit 1
          fi
          if [[ "$ISSUE_DATE" < "$(TZ=Asia/Tokyo date +%F)" ]]; then
            echo "NIGHT SIGNAL issue $ISSUE_DATE is still unverified after its publication date." >&2
            exit 1
          fi
          ACTION="$(python3 scripts/publication_timing.py --issue-deadline "$ISSUE_DATE")"
          if [[ "$ACTION" == "missed" ]]; then
            echo "NIGHT SIGNAL publication remains incomplete after the deadline." >&2
            echo "stage=${{ steps.final.outputs.stage }}" >&2
            echo "activation_proven_today=${{ steps.final.outputs.activation_proven_today }}" >&2
            echo "No Evidence recollection or model review was repeated." >&2
            exit 1
          fi
          echo "Pre-deadline checkpoint: stage=${{ steps.final.outputs.stage }}."
          echo "A later watchdog or Web-owner heartbeat may still complete the same checkpoints."

      - name: Detect a missed issue across JST midnight
        if: ${{ always() && (github.event_name == 'schedule' || github.event.workflow_run.name == 'NIGHT SIGNAL Evidence Collection') }}
        run: |
          PREVIOUS_ISSUE_DATE="$(TZ=Asia/Tokyo date --date=yesterday +%F)"
          python3 scripts/publication_audit.py "$PREVIOUS_ISSUE_DATE" --public-date-only
