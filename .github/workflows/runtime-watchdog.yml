name: NIGHT SIGNAL Runtime Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "50 09 * * *"
    - cron: "40 10 * * *"
    - cron: "55 10 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: night-signal-background-orchestrator
  cancel-in-progress: false

jobs:
  verify-remote-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect missing independent collection path
        id: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ISSUE_DATE="$(python3 scripts/night_signal_publish.py --resolve-issue-date)"
          python3 scripts/night_signal_runtime_audit.py "$ISSUE_DATE" \
            --write-status
          RECOVERY_PATH="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["recovery_path"])' "state/$ISSUE_DATE/runtime_status.json")"
          if [[ -z "$ISSUE_DATE" || -z "$RECOVERY_PATH" ]]; then
            echo "Runtime audit did not produce issue_date/recovery_path" >&2
            exit 1
          fi
          echo "issue_date=$ISSUE_DATE" >> "$GITHUB_OUTPUT"
          echo "recovery_path=$RECOVERY_PATH" >> "$GITHUB_OUTPUT"

      - name: Dispatch unattended recovery
        if: steps.runtime.outputs.recovery_path != 'fresh_evening_issue'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ORCHESTRATOR_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          gh workflow run unattended-collection.yml \
            --ref main \
            -f issue_date="${{ steps.runtime.outputs.issue_date }}" \
            -f force=true

      - name: Wait for unattended recovery
        if: steps.runtime.outputs.recovery_path != 'fresh_evening_issue'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=""
          for attempt in $(seq 1 40); do
            RUN_ID="$(gh run list \
              --workflow unattended-collection.yml \
              --branch main \
              --event workflow_dispatch \
              --json databaseId,createdAt \
              --jq '.[] | select(.createdAt >= env.ORCHESTRATOR_STARTED_AT) | .databaseId' \
              | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 15
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "No unattended collection run appeared after $ORCHESTRATOR_STARTED_AT" >&2
            exit 1
          fi
          echo "UNATTENDED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --exit-status

      - name: Wait for Pages publication
        if: steps.runtime.outputs.recovery_path != 'fresh_evening_issue'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=""
          for attempt in $(seq 1 40); do
            RUN_ID="$(gh run list \
              --workflow pages.yml \
              --branch main \
              --event workflow_dispatch \
              --json databaseId,createdAt \
              --jq '.[] | select(.createdAt >= env.ORCHESTRATOR_STARTED_AT) | .databaseId' \
              | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 15
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "No Pages publication run appeared after unattended collection $UNATTENDED_RUN_ID" >&2
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status

      - name: Verify committed issue when available
        if: steps.runtime.outputs.recovery_path == 'fresh_evening_issue'
        run: |
          ISSUE_DATE="${{ steps.runtime.outputs.issue_date }}"
          python3 scripts/night_signal_publish.py "$ISSUE_DATE" --deploy-existing --verification-profile deploy
