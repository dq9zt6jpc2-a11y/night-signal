name: NIGHT SIGNAL Independent Editor Trial
run-name: ${{ inputs.supplement && format('Independent editor supplement {0}', inputs.issue_date) || inputs.watchdog_probe && format('Independent editor watchdog probe {0}', inputs.issue_date) || format('Independent editor trial {0}', inputs.issue_date) }}

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: JST issue date with a retained final Evidence artifact
        required: true
        type: string
      sample:
        description: Test a small group of real events to diagnose inference and output limits
        type: boolean
        default: false
      watchdog_probe:
        description: Read-only deadline-bound trial requested by the scheduled watchdog
        type: boolean
        default: false
      supplement:
        description: One follow-up of a published provisional issue using its checkpoints
        type: boolean
        default: false
      resume_run_id:
        description: Optional prior trial run ID with editorial checkpoints
        type: string
      history_commit:
        description: Optional trusted main commit containing the historical comparison issues
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: night-signal-independent-editor-trial
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      resume: ${{ steps.resume.outputs.eligible }}
      retry_at: ${{ steps.resume.outputs.retry_at }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore final Evidence without starting collection
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_DATE: ${{ inputs.issue_date }}
        run: |
          [[ "$ISSUE_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]
          python3 scripts/night_signal_review_artifact.py "$ISSUE_DATE" --restore-only
      - name: Restore matching checkpoint candidates from an earlier editor trial
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$(gh run view "$RESUME_RUN_ID" --json workflowName,status --jq '.workflowName + ":" + .status')" == "NIGHT SIGNAL Independent Editor Trial:completed" ]]
          gh run download "$RESUME_RUN_ID" --name independent-editor-trial --dir "$RUNNER_TEMP/independent-editor-resume"
      - name: Recheck eligibility when the queued probe starts
        id: probe_gate
        if: inputs.watchdog_probe
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_DATE: ${{ inputs.issue_date }}
        run: |
          audit="$RUNNER_TEMP/queued-probe-audit.json"
          python3 scripts/night_signal_operational_audit.py "$ISSUE_DATE" --report-only > "$audit"
          decision="$(python3 scripts/night_signal_editor_recovery_decision.py "$audit")"
          echo "$decision"
          if jq -e '.reason == "eligible_for_independent_editor" or .reason == "eligible_for_late_recovery"' <<< "$decision" >/dev/null; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and validate the independent review
        id: generate
        timeout-minutes: 16
        if: vars.NIGHT_SIGNAL_WORKERS_AI_FREE_VERIFIED == 'true' && (!inputs.watchdog_probe || steps.probe_gate.outputs.eligible == 'true')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HISTORY_COMMIT: ${{ inputs.history_commit }}
          SAMPLE_ONLY: ${{ inputs.sample }}
          NIGHT_SIGNAL_WORKERS_AI_TOKEN: ${{ secrets.NIGHT_SIGNAL_WORKERS_AI_TOKEN }}
          ISSUE_DATE: ${{ inputs.issue_date }}
        run: |
          args=()
          if [[ -n "$HISTORY_COMMIT" ]]; then
            [[ "$HISTORY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$HISTORY_COMMIT" origin/main
            args+=(--history-commit "$HISTORY_COMMIT")
          fi
          if [[ -d "$RUNNER_TEMP/independent-editor-resume" ]]; then
            args+=(--resume "$RUNNER_TEMP/independent-editor-resume")
          fi
          if [[ "$SAMPLE_ONLY" == "true" ]]; then args+=(--sample); fi
          python3 scripts/night_signal_independent_editor.py \
            "state/$ISSUE_DATE/editor_packet.json" \
            "state/$ISSUE_DATE/evidence.json" \
            "$RUNNER_TEMP/independent-editor" "${args[@]}"
      - name: Require a verified free account
        if: vars.NIGHT_SIGNAL_WORKERS_AI_FREE_VERIFIED != 'true'
        run: |
          echo "Workers AI Free plan has not been verified for this repository." >&2
          exit 1
      - uses: actions/upload-artifact@v7.0.1
        id: save
        if: always()
        with:
          name: independent-editor-trial
          path: ${{ runner.temp }}/independent-editor
          if-no-files-found: ignore
          retention-days: 3
      - name: Identify an interrupted full trial with reusable work
        id: resume
        if: >-
          ${{ always() && github.ref == 'refs/heads/main' && !inputs.sample &&
              inputs.resume_run_id == '' && steps.generate.outcome == 'failure' &&
              steps.save.outcome == 'success' }}
        run: |
          directory="$RUNNER_TEMP/independent-editor"
          if [[ -f "$directory/provider_backoff.json" ]]; then
            retry_at="$(jq -er '.retry_at | select(type == "number" and . == floor)' "$directory/provider_backoff.json")"
            if (( retry_at > $(date +%s) + 60 )); then
              echo "deferred=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "retry_at=$retry_at" >> "$GITHUB_OUTPUT"
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f "$directory/candidate_review.json" ]] &&
             compgen -G "$directory/responses/*.json" > /dev/null; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always() && inputs.watchdog_probe && steps.resume.outputs.deferred == 'true'
        with:
          name: independent-editor-backoff
          path: ${{ runner.temp }}/independent-editor/provider_backoff.json
          if-no-files-found: error
          retention-days: 3

  resume_once:
    needs: trial
    if: ${{ always() && needs.trial.outputs.resume == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch one continuation after checkpoints have been saved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_DATE: ${{ inputs.issue_date }}
          HISTORY_COMMIT: ${{ inputs.history_commit }}
          WATCHDOG_PROBE: ${{ inputs.watchdog_probe }}
          RETRY_AT: ${{ needs.trial.outputs.retry_at }}
        run: |
          if [[ -n "$RETRY_AT" ]]; then
            delay=$(( RETRY_AT - $(date +%s) ))
            if (( delay > 0 )); then sleep "$delay"; fi
          fi
          # Workflow-level concurrency lets the continuation start after this run ends.
          gh workflow run independent-editor-trial.yml --ref main \
            -f "issue_date=$ISSUE_DATE" \
            -f "history_commit=$HISTORY_COMMIT" \
            -f "resume_run_id=$GITHUB_RUN_ID" \
            -f "watchdog_probe=$WATCHDOG_PROBE"
